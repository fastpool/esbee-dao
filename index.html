<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esbee DAO — a hive that holds the bond</title>
<meta name="description" content="Esbee DAO is the operator seat of a pooled sBTC + STX staker for pox-5 Bitcoin Staking Bonds, held by its members rather than by a key.">
<link rel="icon" type="image/svg+xml" href="esbee.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="mask-icon" href="esbee.svg" color="#c67139">
<link rel="stylesheet" href="styles.css">
<style>
html { scroll-behavior: smooth; }
body { margin: 0; }
a:hover { color: var(--color-accent-700); }
@keyframes esbee-drift { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(-3deg); } }
@keyframes esbee-fill { from { width: 0; } }
</style>
</head>
<body>
<div id="app"></div>
<!-- Wallet and transaction feedback. Outside the template so a re-render
     cannot clear it mid-transaction. -->
<div id="notice" hidden role="status" aria-live="polite"
     style="position:fixed;left:50%;transform:translateX(-50%);z-index:80;
            max-width:min(92vw,64ch);padding:10px 16px;border-radius:16px;
            background:var(--color-surface);color:var(--color-text);
            box-shadow:var(--shadow-lg);font:14px/1.45 var(--font-body);
            overflow-wrap:anywhere"></div>
<!-- The discussion. Its own mount and template, rendered by src/chat.ts on its
     own schedule: a message arriving must not re-render the page, and a page
     re-render must not wipe the log. -->
<div id="chat"></div>
<template id="chat-tpl">
<sc-if value="{{ chatClosed }}">
  <button class="chat-fab" sc-camel-on-click="{{ toggleChat }}" aria-label="Open the discussion">
    <svg width="18" height="18" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="display:block"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.7a.6.6 0 0 1-1-.47V16A2.5 2.5 0 0 1 4 13.5Z" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"></path></svg>
    <span>{{ fabLabel }}</span>
    <sc-if value="{{ hasUnread }}"><span class="chat-badge">{{ unread }}</span></sc-if>
  </button>
</sc-if>
<sc-if value="{{ chatOpen }}">
  <section class="chat-panel" role="dialog" aria-label="Discussion">
    <header class="chat-head">
      <div style="min-width:0;flex:1">
        <div style="font-family:var(--font-heading);font-size:18px;line-height:1.1">Discussion</div>
        <div class="text-muted" style="font-size:12px;margin-top:2px">{{ statusLine }}<sc-if value="{{ hasRoomLink }}"> · <a href="{{ roomLink }}" target="_blank" rel="noopener noreferrer" style="color:inherit" title="This room, outside this page">open elsewhere ↗</a></sc-if></div>
      </div>
      <button class="chat-me" sc-camel-on-click="{{ openIdentity }}" title="Your chat identity">
        <span class="chat-dot" style="background:{{ myColor }}"></span><span class="chat-me-name">{{ myName }}</span>
      </button>
      <button class="btn btn-icon btn-ghost" sc-camel-on-click="{{ toggleChat }}" aria-label="Close the discussion" style="font-size:16px;flex:none">✕</button>
    </header>

    <div class="chat-tabs">
      <div class="seg">
        <button class="seg-opt" sc-camel-on-click="{{ tabs.showPublic }}" style="background:{{ tabs.publicBg }};color:{{ tabs.publicFg }};border:0;font:inherit;font-size:13px;cursor:pointer">Public</button>
        <button class="seg-opt" sc-camel-on-click="{{ tabs.showMembers }}" style="background:{{ tabs.membersBg }};color:{{ tabs.membersFg }};border:0;font:inherit;font-size:13px;cursor:pointer">Members<span style="font-size:11px;opacity:.7;margin-left:6px">{{ tabs.membersNote }}</span></button>
      </div>
    </div>

    <sc-if value="{{ hasTopic }}">
      <div class="chat-topic">
        <button class="chat-ref" sc-camel-on-click="{{ openTopic }}" title="Show the proposal">#{{ topicId }} · {{ topicTitle }}</button>
        <button class="btn btn-ghost" sc-camel-on-click="{{ clearTopic }}" style="font-size:12px;padding:4px 8px;flex:none">all messages</button>
      </div>
    </sc-if>

    <sc-if value="{{ showMembers }}">
      <div class="chat-topic">
        <span class="text-muted" style="font-size:12.5px">{{ membersLine }}</span>
        <button class="btn btn-ghost" sc-camel-on-click="{{ openMembers }}" style="font-size:12px;padding:4px 8px;flex:none">who is here</button>
      </div>
    </sc-if>
    <div class="chat-log" id="chat-log">
      <sc-if value="{{ showFailed }}">
        <div class="chat-gate"><div class="chat-gate-title">Could not load the chat</div><p class="text-muted" style="margin:0;font-size:13px">{{ failedText }}</p></div>
      </sc-if>
      <sc-if value="{{ showGate }}">
        <div class="chat-gate">
          <div class="chat-gate-title">{{ gateTitle }}</div>
          <p style="margin:0 0 12px;font-size:13.5px;line-height:1.55;opacity:.85">{{ gateText }}</p>
          <sc-if value="{{ hasGateAction }}"><button class="btn btn-primary" sc-camel-on-click="{{ gateRun }}" style="font-size:13px">{{ gateAction }}</button></sc-if>
          <sc-if value="{{ busy }}"><span class="text-muted" style="font-size:12.5px">{{ busyLabel }}</span></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ showEmpty }}">
        <p class="text-muted" style="margin:auto;text-align:center;font-size:13.5px;padding:24px">{{ emptyText }}</p>
      </sc-if>
      <sc-for list="{{ messages }}" as="m">
        <div class="chat-msg">
          <sc-if value="{{ m.showHead }}">
            <div class="chat-msg-head">
              <span class="chat-dot" style="background:{{ m.color }}"></span>
              <button class="chat-name" sc-camel-on-click="{{ m.openProfile }}" style="color:{{ m.color }}" title="Who is this?">{{ m.name }}</button>
              <sc-if value="{{ m.online }}"><span class="chat-online" title="Here now"></span></sc-if>
              <sc-if value="{{ m.member }}"><span class="chat-member" title="A wallet holding a position in the pool has signed for this identity">member</span></sc-if>
              <span class="chat-time">{{ m.time }}</span>
            </div>
          </sc-if>
          <div class="chat-row"><div class="chat-bubble" style="background:{{ m.bg }}"><sc-for list="{{ m.parts }}" as="s"><sc-if value="{{ s.plain }}">{{ s.text }}</sc-if><sc-if value="{{ s.href }}"><a href="{{ s.href }}" target="_blank" rel="noopener noreferrer">{{ s.text }}</a></sc-if></sc-for></div><sc-if value="{{ m.canReact }}"><button class="chat-out" sc-camel-on-click="{{ m.react }}" title="React">☺+</button></sc-if><sc-if value="{{ m.hasLink }}"><a class="chat-out" href="{{ m.link }}" target="_blank" rel="noopener noreferrer" title="This message on njump">↗</a></sc-if></div>
          <sc-if value="{{ m.hasReactions }}">
            <div class="chat-reactions"><sc-for list="{{ m.reactions }}" as="r"><button class="chat-reaction" sc-camel-on-click="{{ r.toggle }}" style="background:{{ r.bg }};border-color:{{ r.border }}" title="{{ r.who }}">{{ r.emoji }} <span>{{ r.count }}</span></button></sc-for></div>
          </sc-if>
          <sc-if value="{{ m.hasProposal }}"><button class="chat-ref" sc-camel-on-click="{{ m.openProposal }}">#{{ m.proposal }} · {{ m.proposalTitle }}</button></sc-if>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{ hasNotice }}">
      <div class="chat-notice"><span style="flex:1">{{ notice }}</span><button class="btn btn-ghost" sc-camel-on-click="{{ clearNotice }}" style="font-size:12px;padding:2px 6px">✕</button></div>
    </sc-if>

    <sc-if value="{{ pickerOpen }}">
      <div class="chat-picker">
        <div class="chat-picker-head"><span>{{ pickerTitle }}</span><button class="btn btn-ghost" sc-camel-on-click="{{ closePicker }}" style="font-size:12px;padding:2px 6px">✕</button></div>
        <sc-if value="{{ pickerQuick }}">
          <div class="chat-picker-quick"><sc-for list="{{ quick }}" as="e"><button class="chat-picker-emoji" sc-camel-on-click="{{ e.pick }}">{{ e.char }}</button></sc-for></div>
        </sc-if>
        <div class="chat-picker-grid"><sc-for list="{{ emojis }}" as="e"><button class="chat-picker-emoji" sc-camel-on-click="{{ e.pick }}" title="{{ e.name }}">{{ e.char }}</button></sc-for></div>
      </div>
    </sc-if>

    <sc-if value="{{ canWrite }}">
      <div class="chat-compose">
        <button class="chat-emoji-btn" sc-camel-on-click="{{ togglePicker }}" title="Emoji" aria-label="Add an emoji">☺</button>
        <textarea class="input" id="chat-input" rows="1" placeholder="{{ placeholder }}" autocomplete="off" aria-label="Message">{{ draft }}</textarea>
        <button class="btn btn-primary" sc-camel-on-click="{{ send }}" style="font-size:13px;flex:none">{{ sendLabel }}</button>
      </div>
      <div class="chat-foot text-muted">{{ footLine }}</div>
    </sc-if>

    <sc-if value="{{ sheetOpen }}">
      <div class="chat-sheet-backdrop" sc-camel-on-click="{{ closeSheet }}"></div>
      <div class="chat-sheet">
        <sc-if value="{{ sheetIdentity }}">
          <div class="chat-sheet-head"><span>Your chat identity</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <div style="display:flex;align-items:center;gap:12px">
            <span class="chat-dot" style="background:{{ myColor }};width:34px;height:34px"></span>
            <div style="min-width:0">
              <div style="font-family:var(--font-heading);font-size:17px">{{ myName }}</div>
              <div class="text-muted" style="font-family:ui-monospace,monospace;font-size:11.5px;overflow-wrap:anywhere">{{ myKey }}</div>
            </div>
          </div>
          <sc-if value="{{ canRename }}">
            <div class="field">
              <label for="chat-name">Display name</label>
              <div style="display:flex;gap:8px">
                <input class="input" id="chat-name" value="{{ nameDraft }}" placeholder="{{ myName }}" maxlength="40" autocomplete="off">
                <button class="btn btn-secondary" sc-camel-on-click="{{ saveName }}" style="font-size:13px;flex:none">Save</button>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ cannotRename }}">
            <p class="text-muted" style="margin:0;font-size:13px">Your name comes with the key you brought. Change it where that key lives.</p>
          </sc-if>
          <div class="chat-verified">
            <sc-if value="{{ verifiedOk }}"><span style="color:var(--color-accent-2-700)">✓</span></sc-if>
            <span style="flex:1">{{ verifiedLine }}</span>
            <sc-if value="{{ showVerify }}"><button class="btn btn-primary" sc-camel-on-click="{{ verify }}" style="font-size:12.5px;padding:6px 12px">{{ verifyLabel }}</button></sc-if>
          </div>
          <sc-if value="{{ busy }}"><p class="text-muted" style="margin:0;font-size:12.5px">{{ busyLabel }}</p></sc-if>
          <p class="text-muted" style="margin:0;font-size:13px;line-height:1.5">{{ identityKind }}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <sc-if value="{{ canBackup }}"><button class="btn btn-secondary" sc-camel-on-click="{{ openBackup }}" style="font-size:13px">Back up this key</button></sc-if>
            <button class="btn btn-secondary" sc-camel-on-click="{{ openBring }}" style="font-size:13px">Bring your own key</button>
            <button class="btn btn-ghost" sc-camel-on-click="{{ newKey }}" style="font-size:13px">Start over</button>
          </div>
        </sc-if>

        <sc-if value="{{ sheetBring }}">
          <div class="chat-sheet-head"><span>Bring your own key</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <p class="text-muted" style="margin:0;font-size:13px;line-height:1.5">The chat runs on Nostr. If you already have a Nostr identity you can use it here, and your name and messages follow you between devices.</p>
          <sc-if value="{{ hasExtension }}"><button class="btn btn-secondary" sc-camel-on-click="{{ useExtension }}" style="font-size:13px;align-self:flex-start">Use the browser extension</button></sc-if>
          <sc-if value="{{ noExtension }}"><p class="text-muted" style="margin:0;font-size:12.5px">No signer extension was found in this browser (Alby, nos2x and the like).</p></sc-if>
          <div class="field">
            <label for="chat-bunker">Remote signer — Amber, nsec.app, a bunker</label>
            <div style="display:flex;gap:8px">
              <input class="input" id="chat-bunker" placeholder="bunker://…" autocomplete="off" spellcheck="false">
              <button class="btn btn-secondary" sc-camel-on-click="{{ useBunker }}" style="font-size:13px;flex:none">Connect</button>
            </div>
          </div>
          <sc-if value="{{ remoteWaiting }}">
            <div class="chat-gate" style="gap:8px">
              <div style="font-size:13px">Open this link with your signer, then come back. Waiting…</div>
              <a class="btn btn-primary" href="{{ remoteUri }}" style="font-size:13px;align-self:flex-start">Open in Amber</a>
              <code style="font-size:11px;overflow-wrap:anywhere;opacity:.7">{{ remoteUri }}</code>
              <div style="display:flex;gap:8px"><button class="btn btn-secondary" sc-camel-on-click="{{ copyRemote }}" style="font-size:12.5px">Copy link</button><button class="btn btn-ghost" sc-camel-on-click="{{ cancelRemote }}" style="font-size:12.5px">Cancel</button></div>
            </div>
          </sc-if>
          <sc-if value="{{ remoteWaitingNot }}"><button class="btn btn-ghost" sc-camel-on-click="{{ startRemote }}" style="font-size:13px;align-self:flex-start">Or let the signer connect to this page ↗</button></sc-if>
          <div class="field">
            <label for="chat-nsec">A secret key you hold</label>
            <div style="display:flex;gap:8px">
              <input class="input" id="chat-nsec" type="password" placeholder="nsec1…" autocomplete="off">
              <button class="btn btn-secondary" sc-camel-on-click="{{ useNsec }}" style="font-size:13px;flex:none">Use it</button>
            </div>
          </div>
          <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.5">A key you paste is kept in this browser's storage, like the generated one. An extension or a remote signer keeps it out of the page altogether.</p>
          <sc-if value="{{ busy }}"><p class="text-muted" style="margin:0;font-size:12.5px">{{ busyLabel }}</p></sc-if>
        </sc-if>

        <sc-if value="{{ sheetBackup }}">
          <div class="chat-sheet-head"><span>Back up this key</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <p style="margin:0;font-size:13.5px;line-height:1.5">Anyone holding this secret can write as you. Keep it somewhere private; paste it into another browser, or a Nostr app, to be the same person there.</p>
          <code style="font-size:12px;overflow-wrap:anywhere;padding:10px 12px;background:var(--color-surface);border-radius:var(--radius-md);display:block">{{ nsec }}</code>
          <div style="display:flex;gap:8px"><button class="btn btn-secondary" sc-camel-on-click="{{ copyNsec }}" style="font-size:13px">Copy</button><button class="btn btn-ghost" sc-camel-on-click="{{ openIdentity }}" style="font-size:13px">Back</button></div>
        </sc-if>

        <sc-if value="{{ sheetMembers }}">
          <div class="chat-sheet-head"><span>Who is here</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.5">{{ membersLine }}. Every wallet that has signed for a chat key, whether or not the pool counts it a member. Online means their page has said so in the last two minutes.</p>
          <div class="chat-people">
            <sc-for list="{{ people }}" as="p">
              <button class="chat-person" sc-camel-on-click="{{ p.open }}">
                <span class="chat-dot" style="background:{{ p.color }};width:14px;height:14px"></span>
                <span style="min-width:0;flex:1">
                  <span style="display:flex;align-items:center;gap:6px;font-family:var(--font-heading);font-size:14px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ p.name }}</span><sc-if value="{{ p.isMe }}"><span class="text-muted" style="font-family:var(--font-body);font-size:11px">you</span></sc-if><sc-if value="{{ p.online }}"><span class="chat-online"></span></sc-if></span>
                  <span class="text-muted" style="display:block;font-family:ui-monospace,monospace;font-size:11px">{{ p.addressShort }} · {{ p.npubShort }}</span>
                </span>
                <sc-if value="{{ p.member }}"><span class="chat-member">member</span></sc-if>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ sheetProfile }}">
          <div class="chat-sheet-head"><span>{{ profile.name }}</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <div style="display:flex;align-items:center;gap:12px">
            <span class="chat-dot" style="background:{{ profile.color }};width:34px;height:34px"></span>
            <div style="min-width:0">
              <div style="display:flex;align-items:center;gap:8px;font-size:13.5px"><sc-if value="{{ profile.online }}"><span class="chat-online"></span></sc-if>{{ profile.onlineLabel }}<sc-if value="{{ profile.isMe }}"><span class="text-muted">· you</span></sc-if></div>
              <div class="text-muted" style="font-size:12.5px">{{ profile.memberLabel }}</div>
            </div>
          </div>
          <sc-if value="{{ profile.linked }}">
            <div class="chat-verified" style="flex-direction:column;align-items:stretch;gap:4px">
              <span class="text-muted" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">Stacks address</span>
              <code style="font-size:12px;overflow-wrap:anywhere">{{ profile.address }}</code>
              <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" sc-camel-on-click="{{ profile.copyAddress }}" style="font-size:12px;padding:5px 11px">Copy</button><a class="btn btn-secondary" href="{{ profile.explorer }}" target="_blank" rel="noopener noreferrer" style="font-size:12px;padding:5px 11px">Explorer ↗</a></div>
            </div>
          </sc-if>
          <div class="chat-verified" style="flex-direction:column;align-items:stretch;gap:4px">
            <span class="text-muted" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">Chat key</span>
            <code style="font-size:12px;overflow-wrap:anywhere">{{ profile.npub }}</code>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" sc-camel-on-click="{{ profile.copyKey }}" style="font-size:12px;padding:5px 11px">Copy</button><a class="btn btn-secondary" href="{{ profile.njump }}" target="_blank" rel="noopener noreferrer" style="font-size:12px;padding:5px 11px">njump ↗</a></div>
          </div>
        </sc-if>
      </div>
    </sc-if>
  </section>
</sc-if>
</template>
<noscript>
  <div style="max-width:60ch;margin:12vh auto;padding:0 24px;font-family:var(--font-body)">
    <h1>Esbee DAO</h1>
    <p>This page renders its proposal floor in the browser, so it needs JavaScript.
    The contracts it describes do not: everything here is a view onto
    <code>esbee-dao.clar</code> and <code>bond-staker.clar</code>.</p>
  </div>
</noscript>

<!-- The design, verbatim. `sc-for`, `sc-if` and `{{ }}` are resolved by app.js;
     keeping them means this markup still diffs cleanly against the canvas. -->
<template id="tpl">
<!-- `overflow-x: clip`, not `hidden`. Both stop a stray wide child from
     scrolling the page sideways, but `hidden` makes this div a scroll
     container, and a scroll container is what a `position: sticky` descendant
     sticks to -- which is why the header below scrolled away with the page
     despite being sticky since the design was drawn. `clip` clips without
     creating one. -->
<div style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh;overflow-x:clip">

<header style="position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--color-bg) 88%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent)">
  <div style="max-width:1240px;margin:0 auto;padding:12px clamp(20px,4vw,40px);display:flex;align-items:center;gap:clamp(12px,3vw,32px);flex-wrap:wrap">
    <a href="#top" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--color-text);margin-right:auto">
      <svg width="34" height="34" sc-camel-view-box="0 0 64 64" style="display:block">
        <path d="M32 3 L59 18 L59 46 L32 61 L5 46 L5 18 Z" style="fill:var(--color-surface);stroke:var(--color-text);stroke-width:3.4;stroke-linejoin:round"></path>
        <ellipse cx="20" cy="26" rx="8" ry="4.4" transform="rotate(-32 20 26)" style="fill:var(--color-text);opacity:.22"></ellipse>
        <ellipse cx="44" cy="26" rx="8" ry="4.4" transform="rotate(32 44 26)" style="fill:var(--color-text);opacity:.22"></ellipse>
        <ellipse cx="32" cy="38" rx="9.5" ry="13" style="fill:var(--color-accent)"></ellipse>
        <path d="M23.6 33 h16.8 M24.4 42 h15.2" style="stroke:var(--color-text);stroke-width:3.2;stroke-linecap:round"></path>
        <circle cx="32" cy="24" r="5.4" style="fill:var(--color-text)"></circle>
      </svg>
      <span style="font-family:var(--font-heading);font-size:21px;letter-spacing:-0.01em">Esbee<span style="color:var(--color-accent)">.</span></span>
    </a>
    <nav style="display:flex;align-items:center;gap:clamp(10px,2vw,24px);flex-wrap:wrap;font-size:14px">
      <a href="#pool" style="text-decoration:none;color:var(--color-text);white-space:nowrap" style-hover="color:var(--color-accent)">The Pool</a>
      <a href="#govern" style="text-decoration:none;color:var(--color-text);white-space:nowrap" style-hover="color:var(--color-accent)">Governance</a>
      <a href="#vote" style="text-decoration:none;color:var(--color-text);white-space:nowrap" style-hover="color:var(--color-accent)">Vote</a>
      <a href="#trust" style="text-decoration:none;color:var(--color-text);white-space:nowrap" style-hover="color:var(--color-accent)">Trust</a>
      <!-- The other page that reads these contracts: every deployment of them,
           measured, and the calls anyone at all is allowed to finish. It is not
           a section of this page because it is not about the reader's own
           position, and because it is about more pools than this one. -->
      <a href="analytics.html" style="text-decoration:none;color:var(--color-text);white-space:nowrap" style-hover="color:var(--color-accent)">Analytics</a>
    </nav>
    <!-- Which vault the page is talking to. Two of them exist under this DAO
         and they hold different money, so naming it is not decoration: every
         number below is read from this contract and no other. -->
    <sc-if value="{{ poolShow }}">
      <a class="tag tag-accent" href="{{ poolLink }}" target="_blank" rel="noopener" title="{{ poolContract }}" style="flex:none;text-decoration:none;font-family:ui-monospace,monospace;gap:6px;white-space:nowrap">
        <span style="opacity:.75;font-family:var(--font-body)">Esbee DAO contract</span>{{ poolName }} ↗
      </a>
    </sc-if>
    <div class="seg" style="flex:none">
      <sc-for list="{{ networks }}" as="n">
        <button class="seg-opt" sc-camel-on-click="{{ n.choose }}" title="{{ n.note }}" style="background:{{ n.bg }};color:{{ n.fg }};border:0;font:inherit;font-size:12.5px;cursor:pointer">{{ n.label }}</button>
      </sc-for>
    </div>
    <button class="btn btn-primary" sc-camel-on-click="{{ openWallet }}" style="font-size:14px;padding:9px 18px;white-space:nowrap">{{ walletLabel }}</button>
  </div>
</header>

<section id="top" style="position:relative;background:var(--color-surface);overflow:hidden">
  <svg width="100%" height="100%" aria-hidden="true" style="position:absolute;inset:0;opacity:.5">
    <defs>
      <pattern id="combHero" width="51.96" height="90" sc-camel-pattern-units="userSpaceOnUse">
        <g style="fill:none;stroke:var(--color-accent);stroke-width:1.3">
          <path d="M25.98 -30 L51.96 -15 L51.96 15 L25.98 30 L0 15 L0 -15 Z"></path>
          <path d="M0 15 L25.98 30 L25.98 60 L0 75 L-25.98 60 L-25.98 30 Z"></path>
          <path d="M51.96 15 L77.94 30 L77.94 60 L51.96 75 L25.98 60 L25.98 30 Z"></path>
          <path d="M25.98 60 L51.96 75 L51.96 105 L25.98 120 L0 105 L0 75 Z"></path>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#combHero)"></rect>
  </svg>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:clamp(44px,8vw,104px) clamp(20px,4vw,40px) clamp(52px,8vw,110px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,5vw,64px);align-items:center">
    <div>
      <div style="display:inline-flex;align-items:center;gap:8px;background:{{ stage.bg }};color:{{ stage.fg }};border-radius:999px;padding:5px 14px;font-size:12px;letter-spacing:.03em;margin-bottom:clamp(16px,3vw,28px)">
        <span style="width:7px;height:7px;border-radius:50%;background:{{ stage.dot }};display:block"></span>
        {{ stage.label }}
      </div>
      <h1 style="font-size:clamp(40px,7.2vw,80px);line-height:.98;letter-spacing:-0.02em;margin:0 0 clamp(14px,2.5vw,24px);max-width:14ch">A hive that holds the bond.</h1>
      <p style="font-size:clamp(16px,1.7vw,20px);line-height:1.5;max-width:46ch;margin:0 0 clamp(22px,4vw,34px);color:color-mix(in srgb, var(--color-text) 78%, transparent)">Esbee is a pooled staker for Bitcoin Staking Bonds. Workers put in sBTC and the STX it takes to stand beside it; the pool rolls from one bond to the next without ever unwinding, and the honey is split by the shares you held while it was earned.</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        <a class="btn btn-primary" href="#pool" style="font-size:15px;padding:12px 24px">How the pool works</a>
        <a class="btn btn-secondary" href="#vote" style="font-size:15px;padding:12px 24px">See the DAO vote</a>
      </div>
    </div>
    <div style="display:flex;justify-content:center">
      <div style="position:relative;width:min(100%,440px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 30%, var(--color-accent-200), var(--color-accent-300) 62%, var(--color-accent-400));display:grid;place-items:center;box-shadow:var(--shadow-lg)">
        <svg sc-camel-view-box="0 0 64 64" style="width:52%;animation:esbee-drift 6s ease-in-out infinite">
          <path d="M32 3 L59 18 L59 46 L32 61 L5 46 L5 18 Z" style="fill:var(--color-bg);stroke:var(--color-text);stroke-width:3.2;stroke-linejoin:round"></path>
          <ellipse cx="20" cy="26" rx="8.4" ry="4.6" transform="rotate(-32 20 26)" style="fill:var(--color-text);opacity:.2"></ellipse>
          <ellipse cx="44" cy="26" rx="8.4" ry="4.6" transform="rotate(32 44 26)" style="fill:var(--color-text);opacity:.2"></ellipse>
          <ellipse cx="32" cy="38" rx="9.5" ry="13" style="fill:var(--color-accent)"></ellipse>
          <path d="M23.6 33 h16.8 M24.4 42 h15.2" style="stroke:var(--color-text);stroke-width:3.2;stroke-linecap:round"></path>
          <circle cx="32" cy="24" r="5.4" style="fill:var(--color-text)"></circle>
        </svg>
        <div style="position:absolute;bottom:-14px;right:8px;background:var(--color-bg);border-radius:999px;padding:9px 18px;font-family:var(--font-heading);font-size:14px;box-shadow:var(--shadow-md)">Esbee</div>
      </div>
    </div>
  </div>
</section>

<section style="max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(20px,4vw,40px)">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(10px,2vw,18px)">
    <div class="card" style="background:var(--color-surface);padding:20px 22px;gap:4px">
      <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">Pooled sats</span>
      <span style="font-family:var(--font-heading);font-size:clamp(22px,3.4vw,36px);line-height:1.05;white-space:nowrap">{{ statSats }}</span>
      <span class="text-muted" style="font-size:12px">queued, fully withdrawable</span>
    </div>
    <div class="card" style="background:var(--color-surface);padding:20px 22px;gap:4px">
      <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">Epoch</span>
      <span style="font-family:var(--font-heading);font-size:clamp(22px,3.4vw,36px);line-height:1.05;white-space:nowrap">{{ statEpoch }}</span>
      <span class="text-muted" style="font-size:12px">{{ statEpochNote }}</span>
    </div>
    <div class="card" style="background:var(--color-surface);padding:20px 22px;gap:4px">
      <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">Honey paid</span>
      <span style="font-family:var(--font-heading);font-size:clamp(22px,3.4vw,36px);line-height:1.05;white-space:nowrap">{{ statHoney }}</span>
      <span class="text-muted" style="font-size:12px">rewards settled to date</span>
    </div>
  </div>
  <div style="margin-top:clamp(14px,2vw,20px);background:var(--color-surface);border-radius:28px;padding:clamp(18px,3vw,26px) clamp(20px,3vw,30px);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between">
    <div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:baseline">
        <div style="font-family:var(--font-heading);font-size:19px">{{ launch.title }}</div>
        <span style="font-family:var(--font-heading);font-size:19px;color:var(--color-accent)">{{ launch.pct }}</span>
      </div>
      <p class="text-muted" style="margin:2px 0 0;font-size:13px;max-width:52ch">Nobody presses a launch button. <code style="font-family:ui-monospace,monospace;font-size:12px">stake</code> is permissionless — {{ launch.lead }}</p>
      <sc-if value="{{ launch.hasNote }}">
        <p style="margin:8px 0 0;font-size:13px;max-width:52ch;color:var(--color-accent-800)">{{ launch.note }}</p>
      </sc-if>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px">
        <sc-if value="{{ launch.ctaShow }}">
          <a class="btn btn-primary" href="#join" style="font-size:14px">{{ launch.ctaLabel }}</a>
        </sc-if>
        <sc-if value="{{ launch.stakeShow }}">
          <sc-if value="{{ launch.stakeReady }}">
            <button class="btn btn-secondary" sc-camel-on-click="{{ launch.stake }}" style="font-size:14px">{{ launch.stakeLabel }}</button>
          </sc-if>
          <sc-if value="{{ launch.stakeWait }}">
            <span class="text-muted" style="font-size:12.5px;max-width:34ch;line-height:1.45">{{ launch.stakeWait }}</span>
          </sc-if>
        </sc-if>
      </div>
    </div>
    <div style="min-width:min(100%,320px);flex:1">
      <!-- The bar, with the milestone drawn on it: half the allocation, the
           point from which `stake` is worth making. -->
      <div style="position:relative;height:14px;border-radius:999px;background:var(--color-neutral-300)">
        <div style="position:absolute;inset:0;overflow:hidden;border-radius:999px">
          <div style="height:100%;width:{{ launch.barW }};background:var(--color-accent);border-radius:999px"></div>
        </div>
        <sc-if value="{{ launch.milestoneShow }}">
          <span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--color-accent-800);opacity:.55;border-radius:2px"></span>
        </sc-if>
      </div>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:12px;margin-top:7px" class="text-muted"><span>{{ launch.gathered }}</span><span>{{ launch.target }}</span></div>
      <sc-if value="{{ launch.milestoneShow }}">
        <div style="font-size:12px;margin-top:4px;color:var(--color-accent-800)">{{ launch.milestoneLabel }}</div>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ bond.show }}">
    <div style="margin-top:clamp(14px,2vw,20px);background:var(--color-surface);border-radius:28px;padding:clamp(18px,3vw,26px) clamp(20px,3vw,30px);display:flex;flex-direction:column;gap:clamp(16px,2.4vw,22px)">
      <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between">
        <div style="flex:1 1 320px">
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:baseline">
            <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">{{ bond.kicker }}</span>
            <div style="font-family:var(--font-heading);font-size:19px">{{ bond.headline }}</div>
          </div>
          <p class="text-muted" style="margin:2px 0 0;font-size:13px;max-width:52ch">{{ bond.lead }}</p>
        </div>
        <!-- One grid for every row rather than one flex row each, so the three
             columns line up down the card instead of each row spacing itself. -->
        <div style="min-width:min(100%,320px);flex:1;display:grid;grid-template-columns:1fr auto auto;font-size:12px;align-items:baseline">
          <sc-for list="{{ bond.rows }}" as="r">
            <span style="color:{{ r.fg }};padding:6px 0;border-top:1px solid var(--color-divider)">{{ r.icon }} {{ r.label }}</span>
            <span style="font-family:ui-monospace,monospace;opacity:.7;text-align:right;white-space:nowrap;padding:6px 0 6px 14px;border-top:1px solid var(--color-divider)">{{ r.value }}</span>
            <span style="color:var(--color-accent-700);text-align:right;white-space:nowrap;padding:6px 0 6px 14px;border-top:1px solid var(--color-divider)">{{ r.when }}</span>
          </sc-for>
        </div>
      </div>
      <!-- The same heights again, as one ring: bound at the top, the bond's own
           start back at the top, and the phases between them in order. The
           listing above is exact and still leaves the reader to work out which
           of six dates is the one to act on -- and that the window's last
           blocks are pox-5's prepare phase, where `stake` reverts. -->
      <sc-if value="{{ bond.dial.show }}">
        <div style="display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,32px);align-items:center;border-top:1px solid var(--color-divider);padding-top:clamp(14px,2vw,20px)">
          <div style="position:relative;width:192px;height:192px;flex:none">
            <svg width="192" height="192" sc-camel-view-box="0 0 192 192" aria-hidden="true" style="display:block">
              <g transform="rotate(-90 96 96)" fill="none">
                <circle cx="96" cy="96" r="72" stroke="var(--color-neutral-300)" stroke-width="20"></circle>
                <circle cx="96" cy="96" r="72" stroke-width="20" stroke="{{ bond.dial.notice.color }}" stroke-opacity="{{ bond.dial.notice.op }}" stroke-dasharray="{{ bond.dial.notice.dash }}" stroke-dashoffset="{{ bond.dial.notice.offset }}"></circle>
                <circle cx="96" cy="96" r="72" stroke-width="20" stroke="{{ bond.dial.wait.color }}" stroke-opacity="{{ bond.dial.wait.op }}" stroke-dasharray="{{ bond.dial.wait.dash }}" stroke-dashoffset="{{ bond.dial.wait.offset }}"></circle>
                <circle cx="96" cy="96" r="72" stroke-width="20" stroke="{{ bond.dial.open.color }}" stroke-opacity="{{ bond.dial.open.op }}" stroke-dasharray="{{ bond.dial.open.dash }}" stroke-dashoffset="{{ bond.dial.open.offset }}"></circle>
                <circle cx="96" cy="96" r="72" stroke-width="20" stroke="{{ bond.dial.frozen.color }}" stroke-opacity="{{ bond.dial.frozen.op }}" stroke-dasharray="{{ bond.dial.frozen.dash }}" stroke-dashoffset="{{ bond.dial.frozen.offset }}"></circle>
                <circle cx="96" cy="96" r="72" stroke-width="20" stroke="{{ bond.dial.tail.color }}" stroke-opacity="{{ bond.dial.tail.op }}" stroke-dasharray="{{ bond.dial.tail.dash }}" stroke-dashoffset="{{ bond.dial.tail.offset }}"></circle>
                <circle cx="96" cy="96" r="56" stroke="var(--color-divider)" stroke-width="3"></circle>
                <circle cx="96" cy="96" r="56" stroke-width="3" stroke-linecap="round" stroke="{{ bond.dial.elapsed.color }}" stroke-dasharray="{{ bond.dial.elapsed.dash }}" stroke-dashoffset="0"></circle>
              </g>
              <!-- The chain tip, outside the band: the elapsed ring says how far
                   through the run-up it is, this says where that falls. -->
              <circle cx="{{ bond.dial.dotX }}" cy="{{ bond.dial.dotY }}" r="4" fill="var(--color-text)"></circle>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none">
              <span style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.55">{{ bond.dial.centerKicker }}</span>
              <span style="font-family:var(--font-heading);font-size:38px;line-height:1.05">{{ bond.dial.centerValue }}</span>
              <span style="font-size:10.5px;opacity:.6;width:88px;line-height:1.3">{{ bond.dial.centerNote }}</span>
            </div>
          </div>
          <div style="flex:1 1 320px;min-width:min(100%,260px);max-width:min(100%,600px)">
            <div style="display:grid;gap:7px">
              <sc-for list="{{ bond.dial.legend }}" as="ph">
                <div style="display:flex;align-items:center;gap:9px;font-size:12.5px;opacity:{{ ph.op }};font-weight:{{ ph.weight }}">
                  <span style="width:11px;height:11px;border-radius:3px;flex:none;background:{{ ph.color }}"></span>
                  <span style="flex:1 1 auto">{{ ph.label }}</span>
                  <span style="font-family:ui-monospace,monospace;font-size:11.5px;opacity:.7;white-space:nowrap">{{ ph.span }}</span>
                </div>
              </sc-for>
            </div>
            <p style="margin:13px 0 0;font-size:13px;line-height:1.55;max-width:56ch"><span style="font-family:var(--font-heading)">Current phase: {{ bond.dial.phase }}</span> — {{ bond.dial.phaseNote }}</p>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>
</section>

<section style="max-width:1240px;margin:0 auto;padding:clamp(40px,7vw,88px) clamp(20px,4vw,40px)">
  <h2 style="font-size:clamp(28px,4.2vw,46px);max-width:20ch;margin:0 0 10px">The name is not decoration. It is the model.</h2>
  <p class="text-muted" style="max-width:56ch;margin:0 0 clamp(24px,4vw,40px);font-size:16px">Esbee is a bee, and a bee was already what this contract is.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:clamp(12px,2vw,20px)">
    <div class="card elev-sm" style="padding:clamp(22px,3vw,30px);gap:10px">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--color-accent-200);display:grid;place-items:center;font-family:var(--font-heading);color:var(--color-accent-800);font-size:18px">01</div>
      <h3 style="margin:6px 0 0;font-size:23px">The hive</h3>
      <p style="margin:0;font-size:15px;line-height:1.55;opacity:.85">A membership that acts as one. That is what a DAO claims to be, and what quadratic weight is trying to make true rather than assume.</p>
    </div>
    <div class="card elev-sm" style="padding:clamp(22px,3vw,30px);gap:10px">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-200);display:grid;place-items:center;font-family:var(--font-heading);color:var(--color-accent-2-800);font-size:18px">02</div>
      <h3 style="margin:6px 0 0;font-size:23px">Workers and store</h3>
      <p style="margin:0;font-size:15px;line-height:1.55;opacity:.85">Workers put in; the store holds. Members deposit sBTC and STX, the treasury holds the principal, and the ledger never has to net a reserve off a payout.</p>
    </div>
    <div class="card elev-sm" style="padding:clamp(22px,3vw,30px);gap:10px">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--color-accent-200);display:grid;place-items:center;font-family:var(--font-heading);color:var(--color-accent-800);font-size:18px">03</div>
      <h3 style="margin:6px 0 0;font-size:23px">Honey</h3>
      <p style="margin:0;font-size:15px;line-height:1.55;opacity:.85">Yield that accrues slowly and is drawn down later — which is a six-month bond, almost exactly. It is split by shares, not by who is standing there when it lands.</p>
    </div>
  </div>
</section>


<section id="pool" style="background:var(--color-surface);position:relative;overflow:hidden">
  <div style="max-width:1240px;margin:0 auto;padding:clamp(44px,7vw,96px) clamp(20px,4vw,40px)">
    <h2 style="font-size:clamp(28px,4.2vw,46px);margin:0 0 10px;max-width:18ch">How the pool works</h2>
    <p class="text-muted" style="max-width:58ch;margin:0 0 clamp(28px,4vw,48px);font-size:16px">Each bond the pool stakes into is an epoch. pox-5 lets one bond's term end exactly where the next begins, so the pool rolls straight across — moving only the net difference and resizing the STX lock in place.</p>

    <div style="background:var(--color-bg);border-radius:28px;padding:clamp(22px,4vw,38px);margin-bottom:clamp(16px,2.5vw,26px)">
      <div style="display:flex;gap:6px;align-items:stretch;flex-wrap:wrap">
        <div style="flex:1 1 180px;background:var(--color-accent-200);border-radius:20px;padding:16px 20px">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800);opacity:.8">Bond N</div>
          <div style="font-family:var(--font-heading);font-size:20px;margin-top:4px">Epoch 0</div>
        </div>
        <div style="flex:0 0 auto;display:grid;place-items:center;padding:0 4px">
          <div style="font-family:var(--font-heading);font-size:12px;color:var(--color-accent);writing-mode:horizontal-tb;text-align:center">roll ⟶</div>
        </div>
        <div style="flex:1 1 180px;background:var(--color-accent-300);border-radius:20px;padding:16px 20px">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800);opacity:.8">Bond N+6</div>
          <div style="font-family:var(--font-heading);font-size:20px;margin-top:4px">Epoch 1</div>
        </div>
        <div style="flex:0 0 auto;display:grid;place-items:center;padding:0 4px">
          <div style="font-family:var(--font-heading);font-size:12px;color:var(--color-accent);text-align:center">roll ⟶</div>
        </div>
        <div style="flex:1 1 180px;background:var(--color-accent-200);border-radius:20px;padding:16px 20px">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800);opacity:.8">Bond N+12</div>
          <div style="font-family:var(--font-heading);font-size:20px;margin-top:4px">Epoch 2</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;margin-top:22px">
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.85"><strong style="font-family:var(--font-heading);font-weight:400">Positions move at the roll,</strong> so your record never describes a position the pool has already left.</p>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.85"><strong style="font-family:var(--font-heading);font-weight:400">Rewards move when an epoch settles,</strong> a cycle later — so the bond you were actually in is the one that pays you.</p>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.85"><strong style="font-family:var(--font-heading);font-weight:400">A stash bridges the gap.</strong> Leave at a roll and you get your principal back at once, and the final cycle's honey when it arrives.</p>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(12px,2vw,20px)">
      <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px)">
        <span class="tag tag-accent">sats</span>
        <h4 style="margin:12px 0 6px;font-size:21px">What you get back</h4>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.8">The sBTC you deposited. It is held by the treasury as principal, never as reward.</p>
      </div>
      <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px)">
        <span class="tag tag-accent-2">ustx</span>
        <h4 style="margin:12px 0 6px;font-size:21px">The other leg</h4>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.8">Every bond prices sats in STX. pox-5 locks the staker's STX, so the pool holds it and returns it on Stacks.</p>
      </div>
      <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px)">
        <span class="tag tag-neutral">shares</span>
        <h4 style="margin:12px 0 6px;font-size:21px">Your weight in an epoch</h4>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.8">One share per committed satoshi, struck at the roll. Leave at a roll and you keep the shares of the epoch you were part of — and its final honey. Leave <em>early</em> and the shares go with the sats, which is what makes the split honest for whoever stays.</p>
      </div>
    </div>

    <h3 id="join" style="font-size:clamp(22px,3vw,32px);margin:clamp(36px,5vw,60px) 0 6px;scroll-margin-top:90px">Put bitcoin in the pool</h3>
    <p class="text-muted" style="margin:0 0 24px;font-size:15px;max-width:62ch">Deposit sBTC you already hold, or send bitcoin from your own wallet and let the bridge turn it into sBTC. Both end up in the same place. Every deposit needs some STX alongside it, and the page works out how much as you type. Until the pool stakes, your deposit stays yours — withdraw it any time. After that it earns with the pool until the bond ends.</p>
    <div style="background:var(--color-bg);border-radius:28px;padding:clamp(22px,3vw,30px)">
      <div style="display:flex;flex-direction:column;gap:12px">
          <div class="field">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
              <label for="join-sats" style="margin:0">{{ join.amountLabel }}</label>
              <div style="display:flex;align-items:baseline;gap:7px;flex:none;font-size:12px">
                <button sc-camel-on-click="{{ join.showSats }}" style="background:none;border:0;padding:0;font:inherit;font-size:12px;cursor:pointer;color:{{ join.satsFg }};text-decoration:{{ join.satsLine }};text-underline-offset:3px">sats</button>
                <span style="color:var(--color-neutral-500)">·</span>
                <button sc-camel-on-click="{{ join.showSbtc }}" style="background:none;border:0;padding:0;font:inherit;font-size:12px;cursor:pointer;color:{{ join.sbtcFg }};text-decoration:{{ join.sbtcLine }};text-underline-offset:3px">BTC</button>
              </div>
            </div>
            <input class="input" id="join-sats" inputmode="decimal" placeholder="{{ join.placeholder }}" value="{{ join.amount }}" autocomplete="off">
          </div>
          <sc-if value="{{ join.amountLocked }}">
            <p class="text-muted" style="margin:-6px 0 0;font-size:12.5px;line-height:1.5">{{ join.amountLockNote }}</p>
          </sc-if>
          <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:9px 2px">
            <span class="text-muted">STX leg</span><span id="join-quote" style="font-family:var(--font-heading);text-align:right">{{ join.quote }}</span>
          </div>
          <!-- What the member is holding, in both of the things they could pay
               with. The choice below is mostly a question about these two
               numbers, so they come first and read the same way. -->
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;padding:9px 2px;border-top:1px solid var(--color-divider)">
            <span class="text-muted">Your sBTC</span>
            <sc-if value="{{ join.connected }}" hint-placeholder-val="{{ true }}">
              <button sc-camel-on-click="{{ join.useMax }}" title="{{ join.maxHint }}" style="background:none;border:0;padding:0;margin:0;font:inherit;cursor:{{ join.pickCursor }};display:flex;align-items:center;justify-content:flex-end;gap:7px;text-align:right;color:inherit" style-hover="color:var(--color-accent-700)"><img src="icons/sbtc.png" alt="" aria-hidden="true" width="17" height="17" style="width:17px;height:17px;border-radius:4px;flex:none;display:block"><span style="font-family:var(--font-heading)">{{ join.balance }}</span></button>
            </sc-if>
            <sc-if value="{{ join.disconnected }}" hint-placeholder-val="{{ false }}">
              <button class="btn btn-secondary" sc-camel-on-click="{{ join.connect }}" style="font-size:12.5px;padding:5px 14px;flex:none">Connect</button>
            </sc-if>
          </div>
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;padding:9px 2px;border-top:1px solid var(--color-divider)">
            <span class="text-muted">Your BTC</span>
            <button sc-camel-on-click="{{ join.useBtcMax }}" title="{{ join.btcMaxHint }}" style="background:none;border:0;padding:0;margin:0;font:inherit;cursor:{{ join.pickCursor }};display:flex;align-items:center;justify-content:flex-end;gap:7px;text-align:right;color:inherit" style-hover="color:var(--color-accent-700)"><svg viewBox="0 0 64 64" width="17" height="17" aria-hidden="true" style="flex:none;display:block"><circle cx="32" cy="32" r="32" fill="#F7931A"/><path fill="#fff" d="M46.1 28.2c.6-4.2-2.6-6.4-7-7.9l1.4-5.7-3.5-.9-1.4 5.6c-.9-.2-1.8-.4-2.8-.7l1.4-5.6-3.5-.9-1.4 5.7c-.8-.2-1.5-.3-2.2-.5v0l-4.8-1.2-.9 3.7s2.6.6 2.5.6c1.4.4 1.7 1.3 1.6 2.1l-1.6 6.5c.1 0 .2.1.4.1l-.4-.1-2.3 9.1c-.2.4-.6 1.1-1.6.8 0 .1-2.5-.6-2.5-.6l-1.7 4 4.5 1.1c.8.2 1.7.4 2.5.6l-1.4 5.8 3.5.9 1.4-5.7c1 .3 1.9.5 2.8.7l-1.4 5.7 3.5.9 1.4-5.8c6 1.1 10.5.7 12.4-4.7 1.5-4.4-.1-6.9-3.3-8.6 2.3-.5 4-2 4.5-5.1zm-8.1 11.3c-1.1 4.4-8.5 2-10.9 1.4l1.9-7.6c2.4.6 10.1 1.8 9 6.2zm1.1-11.4c-1 4-7.2 2-9.2 1.5l1.7-6.9c2 .5 8.5 1.4 7.5 5.4z"/></svg><span style="font-family:var(--font-heading)">{{ join.btcBalance }}</span></button>
          </div>
          <sc-if value="{{ join.wrongNetwork }}">
            <p style="margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--color-accent-800)">{{ join.networkWarning }}</p>
          </sc-if>
          <!-- The address sits with the balance it belongs to: the bitcoin
               above is what this address holds, and editing one changes the
               other. -->
          <div class="field">
            <label for="btc-address">Your bitcoin address</label>
            <input class="input" id="btc-address" placeholder="{{ l1.addressPlaceholder }}" value="{{ l1.address }}" autocomplete="off" spellcheck="false">
          </div>
          <p class="text-muted" style="margin:-4px 0 0;font-size:12.5px;line-height:1.5">{{ l1.addressNote }}</p>
          <!-- The wallet cannot reach this bitcoin at all. Said before the two
               Stacks calls, since finding out at step 3 costs both of them. -->
          <sc-if value="{{ l1.walletWrongShow }}">
            <p style="margin:-6px 0 0;font-size:13px;line-height:1.55;color:var(--color-accent-800);overflow-wrap:anywhere">{{ l1.walletWrongNote }}</p>
          </sc-if>
          <!-- The connected wallet's own address, where the field holds another.
               An offer, not a correction: any address the member controls will
               do, and only they know which they will send from. -->
          <sc-if value="{{ l1.suggestShow }}">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-6px 0 0">
              <span class="text-muted" style="font-size:12.5px">{{ l1.suggestNote }}</span>
              <code style="font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere;min-width:0">{{ l1.suggestAddress }}</code>
              <button class="btn btn-secondary" sc-camel-on-click="{{ l1.useWallet }}" style="font-size:13px;padding:7px 14px">Use it</button>
            </div>
          </sc-if>
          <!-- One faucet row for all three legs. They were two rows in two
               cards, which asked a reader on testnet to find the STX in one
               place and the bitcoin in another. -->
          <sc-if value="{{ join.faucets }}">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:2px">
              <span class="text-muted" style="font-size:12.5px">Testnet faucet</span>
              <button class="btn btn-secondary" sc-camel-on-click="{{ join.faucetSbtc }}" style="font-size:13px;padding:7px 14px">Get sBTC</button>
              <button class="btn btn-secondary" sc-camel-on-click="{{ join.faucetStx }}" style="font-size:13px;padding:7px 14px">Get STX</button>
              <button class="btn btn-secondary" sc-camel-on-click="{{ l1.faucetBtc }}" style="font-size:13px;padding:7px 14px">Get BTC</button>
              <span class="text-muted" style="font-size:12px">the bitcoin goes to the address above</span>
            </div>
          </sc-if>
          <!-- The faucet's own payment, on the bitcoin explorer. The notice bar
               is text, and a txid nobody can follow is a receipt for nothing. -->
          <sc-if value="{{ l1.faucetTxShow }}">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;margin:-4px 0 0">
              <span class="text-muted" style="font-size:12.5px">Faucet payment</span>
              <a href="{{ l1.faucetTxLink }}" target="_blank" rel="noopener" style="font-size:12px;font-family:ui-monospace,monospace;color:var(--color-accent-800);text-decoration:none" style-hover="text-decoration:underline">{{ l1.faucetTxShort }} ↗</a>
            </div>
          </sc-if>

        <!-- The choice, once. Both balances and the STX leg are above it, so a
             member picks the route they can actually pay rather than finding
             out inside one of them. -->
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px">
          <span class="text-muted" style="font-size:13px">Paying with</span>
          <div style="display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--color-surface);flex-wrap:wrap">
            <button sc-camel-on-click="{{ join.pickSbtc }}" title="{{ join.underwayNote }}" style="border:0;cursor:{{ join.pickCursor }};font:inherit;font-family:var(--font-heading);font-size:13.5px;padding:8px 18px;border-radius:999px;background:{{ join.sbtcPickBg }};color:{{ join.sbtcPickFg }}">sBTC</button>
            <button sc-camel-on-click="{{ join.pickL1 }}" title="{{ join.underwayNote }}" style="border:0;cursor:{{ join.pickCursor }};font:inherit;font-family:var(--font-heading);font-size:13.5px;padding:8px 18px;border-radius:999px;background:{{ join.l1PickBg }};color:{{ join.l1PickFg }}">BTC (L1)</button>
          </div>
          <sc-if value="{{ join.underway }}">
            <span class="text-muted" style="font-size:12.5px;line-height:1.5">settled with the commitment</span>
          </sc-if>
        </div>
        <sc-if value="{{ join.unchosen }}">
          <p class="text-muted" style="margin:-2px 0 0;font-size:13px;line-height:1.55">sBTC you already hold moves in one call. L1 bitcoin is five steps and the order is the whole point — the page walks you through them.</p>
        </sc-if>

        <sc-if value="{{ join.sbtcRoute }}">
          <p class="text-muted" style="margin:0;font-size:14px;line-height:1.6">One call moves both legs: the sBTC you already hold to the treasury, and the STX beside it to the pool. Nothing else to do.</p>
            <sc-if value="{{ join.open }}">
              <button class="btn btn-primary btn-block" sc-camel-on-click="{{ join.deposit }}">Deposit</button>
            </sc-if>
            <sc-if value="{{ join.closed }}">
              <p class="text-muted" style="margin:6px 0 0;font-size:13px;line-height:1.5">{{ join.closedWhy }}</p>
            </sc-if>
            <sc-if value="{{ join.pendingShow }}">
              <div style="display:flex;flex-direction:column;gap:5px;padding:12px 14px;border-radius:var(--radius-md);background:var(--color-surface)">
                <span style="font-size:13px;line-height:1.5">{{ join.pendingText }}</span>
                <a href="{{ join.pendingLink }}" target="_blank" rel="noopener" style="font-size:12px;font-family:ui-monospace,monospace;color:var(--color-accent-800);text-decoration:none" style-hover="text-decoration:underline">{{ join.pendingTxid }} ↗</a>
              </div>
            </sc-if>
        </sc-if>

        <sc-if value="{{ join.l1Route }}">
          <p class="text-muted" style="margin:0;font-size:14px;line-height:1.6">You commit to the address the bitcoin will come from, reveal it a block later, and then send. Nothing has to be built before the first two steps — the address is one you already have.</p>
          <!-- Where the member actually is, read from the bridge against the
               address in the field. Absent until there is something to read: to
               a reader without a wallet the five steps are an explanation, and
               narrating a position nobody holds is worse than saying nothing. -->
            <sc-if value="{{ l1.stageShow }}">
              <div style="display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:var(--radius-md);background:var(--color-surface)">
                <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap">
                  <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">{{ l1.stageStep }}</span>
                  <sc-if value="{{ l1.stageAmountShow }}">
                    <span class="text-muted" style="font-size:12px;font-family:var(--font-heading)">{{ l1.stageAmount }}</span>
                  </sc-if>
                </div>
                <div style="height:4px;border-radius:999px;background:var(--color-divider)">
                  <div style="height:100%;width:{{ l1.stageBarW }};background:var(--color-accent);border-radius:999px"></div>
                </div>
                <strong style="font-family:var(--font-heading);font-weight:400;font-size:16px;line-height:1.3">{{ l1.stageTitle }}</strong>
                <p style="margin:0;font-size:13px;line-height:1.55">{{ l1.stageNote }}</p>
              </div>
                          </sc-if>

            <!-- One step at a time. Each carries its own mark and weight, and the
                 live one opens to hold everything that belongs to it -- its
                 addresses, its fields, its button. What this replaces was a row
                 of five buttons above a stack of panels shown all at once: the
                 same position stated twice, and no way to tell which of six
                 controls the moment called for. -->
            <div style="display:flex;flex-direction:column;gap:10px;opacity:{{ l1.s1.dim }}">
              <div sc-camel-on-click="{{ l1.s1.open }}" style="display:flex;gap:12px;align-items:flex-start;cursor:{{ l1.s1.cursor }}">
                <span style="flex:none;width:26px;height:26px;border-radius:50%;background:{{ l1.s1.bg }};color:{{ l1.s1.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:13px">{{ l1.s1.mark }}</span>
                <p style="flex:1;min-width:0;margin:0;font-size:14px;line-height:1.55"><strong style="font-family:var(--font-heading);font-weight:400">Commit</strong> a hash of that address and the amount. This takes the STX leg, and gives the address away to nobody. <span style="font-family:var(--font-heading);font-size:12px;color:{{ l1.s1.tone }}">{{ l1.s1.state }}</span></p>
              </div>
              <sc-if value="{{ l1.s1.now }}">
              <sc-if value="{{ l1.s1.live }}">
                  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                    <button class="btn {{ l1.commitBtn }}" sc-camel-on-click="{{ l1.commit }}" title="{{ l1.commitHint }}" style="font-size:13px;opacity:{{ l1.commitDim }}">Commit this address</button>
                    <span class="text-muted" style="font-size:12.5px">the STX leg goes with it</span>
                  </div>
              </sc-if>
              </sc-if>
            </div>
                          <div style="display:flex;flex-direction:column;gap:10px;opacity:{{ l1.s2.dim }}">
              <div sc-camel-on-click="{{ l1.s2.open }}" style="display:flex;gap:12px;align-items:flex-start;cursor:{{ l1.s2.cursor }}">
                <span style="flex:none;width:26px;height:26px;border-radius:50%;background:{{ l1.s2.bg }};color:{{ l1.s2.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:13px">{{ l1.s2.mark }}</span>
                <p style="flex:1;min-width:0;margin:0;font-size:14px;line-height:1.55"><strong style="font-family:var(--font-heading);font-weight:400">Reveal</strong> it one bitcoin block later, which claims the address before anyone watching the mempool can. <span style="font-family:var(--font-heading);font-size:12px;color:{{ l1.s2.tone }}">{{ l1.s2.state }}</span></p>
              </div>
              <sc-if value="{{ l1.s2.now }}">
              <sc-if value="{{ l1.digestShow }}">
                  <div style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:var(--radius-md);background:var(--color-surface)">
                    <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">The hash you committed</div>
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0">
                      <code title="{{ l1.digestFull }}" style="font-family:ui-monospace,monospace;font-size:12.5px;overflow-wrap:anywhere;min-width:0">{{ l1.digestShort }}</code>
                      <button class="btn btn-secondary" sc-camel-on-click="{{ l1.copyDigest }}" style="font-size:12px;padding:5px 12px;flex:none">Copy</button>
                    </div>
                    <p class="text-muted" style="margin:2px 0 0;font-size:12.5px;line-height:1.5">Your bitcoin address and a secret, mixed into one number. This is what stands on chain in place of the address, so nobody reading it can tell which address you mean — or claim it before you do. Revealing turns it back into the address.</p>
                  </div>
              </sc-if>
              <sc-if value="{{ l1.saltShow }}">
                  <div style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:var(--radius-md);background:var(--color-surface)">
                    <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:{{ l1.saltTone }}">The secret · {{ l1.saltState }}</div>
                    <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.5">{{ l1.saltNote }}</p>
                  </div>
              </sc-if>
              <sc-if value="{{ l1.s2.live }}">
                  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                    <button class="btn {{ l1.revealBtn }}" sc-camel-on-click="{{ l1.reveal }}" title="{{ l1.revealHint }}" style="font-size:13px;opacity:{{ l1.revealDim }}">Reveal the address</button>
                    <span class="text-muted" style="font-size:12.5px">{{ l1.revealHint }}</span>
                  </div>
              </sc-if>
              </sc-if>
            </div>
                          <div style="display:flex;flex-direction:column;gap:10px;opacity:{{ l1.s3.dim }}">
              <div sc-camel-on-click="{{ l1.s3.open }}" style="display:flex;gap:12px;align-items:flex-start;cursor:{{ l1.s3.cursor }}">
                <span style="flex:none;width:26px;height:26px;border-radius:50%;background:{{ l1.s3.bg }};color:{{ l1.s3.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:13px">{{ l1.s3.mark }}</span>
                <p style="flex:1;min-width:0;margin:0;font-size:14px;line-height:1.55"><strong style="font-family:var(--font-heading);font-weight:400">Deposit</strong> — only now, and only from the address you revealed. The bitcoin goes to a one-off address that credits the treasury. <span style="font-family:var(--font-heading);font-size:12px;color:{{ l1.s3.tone }}">{{ l1.s3.state }}</span></p>
              </div>
              <sc-if value="{{ l1.s3.now }}">
              <sc-if value="{{ l1.revealedShow }}">
                  <div style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:var(--radius-md);background:var(--color-surface)">
                    <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">Send from · {{ l1.revealedHeld }}</div>
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0">
                      <code title="{{ l1.revealedFull }}" style="font-family:ui-monospace,monospace;font-size:12.5px;overflow-wrap:anywhere;min-width:0">{{ l1.revealedShort }}</code>
                      <button class="btn btn-secondary" sc-camel-on-click="{{ l1.copyRevealed }}" style="font-size:12px;padding:5px 12px;flex:none">Copy</button>
                    </div>
                    <p class="text-muted" style="margin:2px 0 0;font-size:12.5px;line-height:1.5">Every input of the transaction is checked against this address, so sats sent from another address of yours are not credited to you.</p>
                  </div>
              </sc-if>
              <sc-if value="{{ l1.targetShow }}">
                  <div style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:var(--radius-md);background:var(--color-surface)">
                    <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">Send to{{ l1.targetAmount }}</div>
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0">
                      <code title="{{ l1.targetAddress }}" style="font-family:ui-monospace,monospace;font-size:12.5px;overflow-wrap:anywhere;min-width:0">{{ l1.targetShort }}</code>
                      <button class="btn btn-secondary" sc-camel-on-click="{{ l1.copyTarget }}" style="font-size:12px;padding:5px 12px;flex:none">Copy</button>
                    </div>
                    <p class="text-muted" style="margin:2px 0 0;font-size:12.5px;line-height:1.5">Yours alone: it commits to the treasury as the account to credit, the signers' current key, and a reclaim path only you can spend — after ~950 blocks, if they never sweep it.</p>
                  </div>
              </sc-if>
                <!-- "Is it safe to send real money to this?" answered with the
                     thing itself rather than with reassurance: the two scripts
                     the address is built from, and what each one lets happen. -->
              <sc-if value="{{ l1.proofShow }}">
                  <details style="margin-top:2px">
                    <summary style="cursor:pointer;font-size:12.5px;color:var(--color-accent-800)">What is this address, and is it safe to pay?</summary>
                    <div style="display:flex;flex-direction:column;gap:10px;padding-top:10px">
                      <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.55">It is not an account. It is a one-off bitcoin address with exactly two ways to spend it, both written into the address itself: the sBTC signers may sweep it and mint sBTC to the pool's treasury, or you may take it back with your own key. There is no third way, and no key here can be changed after the fact — a different address would be a different string, and you are looking at this one.</p>
                      <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.55">{{ l1.proofReclaimNote }}</p>
                      <!-- The five inputs, so the address can be rebuilt away from
                           this page. An address only you can check is one you have
                           to take on trust. -->
                      <div style="display:flex;flex-direction:column;gap:2px;padding-top:2px">
                        <span class="text-muted" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:4px">Built from — put these into <a href="https://sbtc.stacks.co/" target="_blank" rel="noopener" style="color:var(--color-accent-800)">sbtc.stacks.co</a> and you should get the same address back</span>
                        <sc-for list="{{ l1.proofParams }}" as="pp">
                          <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 2px;border-top:1px solid var(--color-divider)">
                            <span class="text-muted" style="flex:none">{{ pp.name }}</span>
                            <span style="font-family:ui-monospace,monospace;font-size:11.5px;overflow-wrap:anywhere;text-align:right;min-width:0">{{ pp.value }}</span>
                          </div>
                        </sc-for>
                      </div>
                      <div style="display:flex;flex-direction:column;gap:6px">
                        <span class="text-muted" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">Deposit path — the signers' half. The recipient and the max fee are inside it</span>
                        <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0">
                          <code style="font-family:ui-monospace,monospace;font-size:11.5px;overflow-wrap:anywhere;min-width:0;flex:1">{{ l1.proofDeposit }}</code>
                          <button class="btn btn-secondary" sc-camel-on-click="{{ l1.copyDeposit }}" style="font-size:12px;padding:5px 12px;flex:none">Copy</button>
                        </div>
                      </div>
                      <div style="display:flex;flex-direction:column;gap:6px">
                        <span class="text-muted" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">Reclaim path — yours. Your key, and the lock time</span>
                        <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0">
                          <code style="font-family:ui-monospace,monospace;font-size:11.5px;overflow-wrap:anywhere;min-width:0;flex:1">{{ l1.proofReclaim }}</code>
                          <button class="btn btn-secondary" sc-camel-on-click="{{ l1.copyReclaim }}" style="font-size:12px;padding:5px 12px;flex:none">Copy</button>
                        </div>
                      </div>
                    </div>
                  </details>
              </sc-if>
                <!-- Paying from a wallet this page cannot drive. The two rules
                     below are the bridge's, not advice: it reads every input of
                     the transaction and refuses the ones it does not recognise. -->
                <details style="margin-top:2px">
                  <summary style="cursor:pointer;font-size:12.5px;color:var(--color-accent-800)">Paying from another bitcoin wallet</summary>
                  <div style="display:flex;flex-direction:column;gap:8px;padding-top:10px">
                    <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.55">Nothing about the bitcoin side is special: it is an ordinary transaction to the address above, and any wallet, node or exchange can make it. This page offers to send it only because your Stacks wallet can, not because it has to.</p>
                    <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.55">Two rules, and they are the bridge's. <strong style="font-family:var(--font-heading);font-weight:400">Every input must come from the address you revealed</strong> — the contract reads them all and rejects a transaction that mixes in coins from anywhere else, so use a wallet that lets you choose which coins to spend. And <strong style="font-family:var(--font-heading);font-weight:400">use at most eight inputs</strong>, which is as many as the contract will check.</p>
                    <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.55">Send, then paste the transaction id under “I sent it from somewhere else” and register it. Change back to your own address is fine; it is the inputs that are checked, not the outputs.</p>
                  </div>
                </details>
              <sc-if value="{{ l1.s3.live }}">
                  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                    <button class="btn {{ l1.depositBtn }}" sc-camel-on-click="{{ l1.deposit }}" title="{{ l1.depositHint }}" style="font-size:13px;opacity:{{ l1.depositDim }}">Send it from my wallet</button>
              <sc-if value="{{ l1.targetHidden }}">
                      <button class="btn btn-secondary" sc-camel-on-click="{{ l1.showAddress }}" style="font-size:13px">Show the address to pay</button>
              </sc-if>
                  </div>
              </sc-if>
                <!-- Bitcoin sent from anywhere else. The page cannot see it go, so
                     the txid is the one thing it has to be told. -->
              <sc-if value="{{ l1.s3.live }}">
                  <details id="btc-sent" style="margin-top:2px">
                    <summary style="cursor:pointer;font-size:12.5px;color:var(--color-accent-800)">I sent it from somewhere else</summary>
                    <div style="display:flex;flex-direction:column;gap:10px;padding-top:10px">
                      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px">
                        <div class="field">
                          <label for="btc-txid">Deposit txid</label>
                          <input class="input" id="btc-txid" placeholder="64 hex characters" value="{{ l1.txid }}" autocomplete="off" spellcheck="false">
                        </div>
                        <div class="field">
                          <label for="btc-vout">Output index</label>
                          <input class="input" id="btc-vout" inputmode="numeric" value="{{ l1.vout }}" autocomplete="off">
                        </div>
                      </div>
                      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                        <button class="btn btn-secondary" sc-camel-on-click="{{ l1.register }}" style="font-size:13px">Register it with the signers</button>
                        <span class="text-muted" style="font-size:12.5px">a deposit nobody registers is never swept</span>
                      </div>
                    </div>
                  </details>
              </sc-if>
              </sc-if>
            </div>
                          <div style="display:flex;flex-direction:column;gap:10px;opacity:{{ l1.s4.dim }}">
              <div sc-camel-on-click="{{ l1.s4.open }}" style="display:flex;gap:12px;align-items:flex-start;cursor:{{ l1.s4.cursor }}">
                <span style="flex:none;width:26px;height:26px;border-radius:50%;background:{{ l1.s4.bg }};color:{{ l1.s4.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:13px">{{ l1.s4.mark }}</span>
                <p style="flex:1;min-width:0;margin:0;font-size:14px;line-height:1.55"><strong style="font-family:var(--font-heading);font-weight:400">Wait</strong> for the sBTC signers to sweep it. They take their fee out of the amount, and the pool credits what arrives. <span style="font-family:var(--font-heading);font-size:12px;color:{{ l1.s4.tone }}">{{ l1.s4.state }}</span></p>
              </div>
              <sc-if value="{{ l1.s4.now }}">
                <!-- The wait, said by the only thing that can see into it. Inside
                     step 4 because that is the step it is about: the member is
                     here, and this is what "here" currently means. -->
              <sc-if value="{{ l1.emilyShow }}">
                  <div style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:var(--radius-md);background:var(--color-surface)">
                    <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:space-between">
                      <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:{{ l1.emilyTone }}">{{ l1.emilyStatus }}</span>
                      <button class="btn btn-secondary" sc-camel-on-click="{{ l1.checkStatus }}" style="font-size:12px;padding:5px 12px;flex:none">Check again</button>
                    </div>
                    <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.5">{{ l1.emilyNote }}</p>
                  </div>
              </sc-if>
              <sc-if value="{{ l1.txidShow }}">
                  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:baseline">
                    <span class="text-muted" style="font-size:12.5px">This deposit on bitcoin</span>
                    <a href="{{ l1.txidLink }}" target="_blank" rel="noopener" style="font-size:12px;font-family:ui-monospace,monospace;color:var(--color-accent-800);text-decoration:none" style-hover="text-decoration:underline">{{ l1.txidShort }} ↗</a>
                  </div>
              </sc-if>
                <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.5">Nothing to press. The page can be closed — step 5 is permissionless and works whenever you come back.</p>
              </sc-if>
            </div>
                          <div style="display:flex;flex-direction:column;gap:10px;opacity:{{ l1.s5.dim }}">
              <div sc-camel-on-click="{{ l1.s5.open }}" style="display:flex;gap:12px;align-items:flex-start;cursor:{{ l1.s5.cursor }}">
                <span style="flex:none;width:26px;height:26px;border-radius:50%;background:{{ l1.s5.bg }};color:{{ l1.s5.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:13px">{{ l1.s5.mark }}</span>
                <p style="flex:1;min-width:0;margin:0;font-size:14px;line-height:1.55"><strong style="font-family:var(--font-heading);font-weight:400">Complete</strong> once it has landed. Permissionless — a keeper can do this for you. <span style="font-family:var(--font-heading);font-size:12px;color:{{ l1.s5.tone }}">{{ l1.s5.state }}</span></p>
              </div>
              <sc-if value="{{ l1.s5.now }}">
              <sc-if value="{{ l1.s5.live }}">
                  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                    <button class="btn {{ l1.completeBtn }}" sc-camel-on-click="{{ l1.complete }}" title="{{ l1.completeHint }}" style="font-size:13px;opacity:{{ l1.completeDim }}">Credit it to the pool</button>
