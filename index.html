<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esbee DAO — a hive that holds the bond</title>
<meta name="description" content="Esbee DAO is the operator seat of a sBTC pool staking with Bitcoin Staking Bonds, held by its members rather than by a key.">
<!-- What everywhere else shows instead of the page.

     Without these a share is the title and the description as grey text, which
     is what Discord and Slack fall back to and what this link looked like until
     now. `og:image` has to be absolute -- a relative one resolves against the
     crawler, not the site -- so the canonical host is written out here rather
     than inferred. `scripts/make-og.mjs` draws the card; `pnpm run og`. -->
<link rel="canonical" href="https://www.esbee-dao.org/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Esbee DAO">
<meta property="og:title" content="Esbee DAO — a hive that holds the bond">
<meta property="og:description" content="Esbee DAO is the operator seat of a sBTC pool staking with Bitcoin Staking Bonds, held by its members rather than by a key.">
<meta property="og:url" content="https://www.esbee-dao.org/">
<meta property="og:image" content="https://www.esbee-dao.org/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Esbee mark beside the words: a hive that holds the bond.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Esbee DAO — a hive that holds the bond">
<meta name="twitter:description" content="Esbee DAO is the operator seat of a sBTC pool staking with Bitcoin Staking Bonds, held by its members rather than by a key.">
<meta name="twitter:image" content="https://www.esbee-dao.org/og.png">
<meta name="theme-color" content="#ebddc5">
<link rel="icon" type="image/svg+xml" href="esbee.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="mask-icon" href="esbee.svg" color="#c67139">
<link rel="stylesheet" href="styles.css">
<style>
html { scroll-behavior: smooth; }
body { margin: 0; }
a:hover { color: var(--color-accent-700); }
@keyframes esbee-drift { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(-3deg); } }
@keyframes esbee-fill { from { width: 0; } }
</style>
</head>
<body data-page="home">
<div id="nav"></div>
<div id="app"></div>
<!-- Wallet and transaction feedback. Outside the template so a re-render
     cannot clear it mid-transaction.

     It used to be one line of grey text, which is a poor way to tell somebody
     their money moved: `src/app.ts` paints it, and the bee is the transaction's
     own state -- hovering while it is in the mempool, and settling onto a comb
     that fills with honey when the block carries it. All of that is CSS on
     `data-state`, so the paint stays a matter of setting three strings. -->
<div id="notice" hidden role="status" aria-live="polite" data-state="plain">
  <span class="notice-art" aria-hidden="true">
    <svg viewBox="0 0 52 34" width="52" height="34" style="display:block;overflow:visible">
      <g class="comb">
        <path class="cell" d="M6 11.8h6l3 5.2-3 5.2H6l-3-5.2z"></path>
        <path class="cell" d="M16 6h6l3 5.2-3 5.2h-6l-3-5.2z"></path>
        <path class="cell" d="M16 17.6h6l3 5.2-3 5.2h-6l-3-5.2z"></path>
      </g>
      <g class="bee">
        <g class="wings">
          <ellipse class="wing" cx="30" cy="11.4" rx="6" ry="3.8"></ellipse>
          <ellipse class="wing" cx="35.4" cy="12.2" rx="4.4" ry="2.9"></ellipse>
        </g>
        <ellipse class="body" cx="34" cy="19" rx="9" ry="6.2"></ellipse>
        <path class="stripes" d="M31 13.6v10.8M35.6 14.7v8.6"></path>
        <circle class="head" cx="42.6" cy="17.6" r="3.5"></circle>
        <path class="antennae" d="M43.6 14.4l1.4-2.8M45.4 15.1l2.4-2"></path>
      </g>
    </svg>
  </span>
  <span class="notice-body">
    <span id="notice-title" class="notice-title"></span>
    <span id="notice-text" class="notice-text"></span>
  </span>
  <a id="notice-link" class="notice-link" target="_blank" rel="noopener" hidden>Explorer ↗</a>
  <button id="notice-close" class="notice-close" type="button" aria-label="Dismiss">✕</button>
</div>
<!-- The discussion. Its own mount and template, rendered by src/chat.ts on its
     own schedule: a message arriving must not re-render the page, and a page
     re-render must not wipe the log. -->
<div id="chat"></div>
<template id="chat-tpl">
<sc-if value="{{ chatClosed }}">
  <button class="chat-fab" sc-camel-on-click="{{ toggleChat }}" aria-label="Open the discussion">
    <svg width="18" height="18" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="display:block"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.7a.6.6 0 0 1-1-.47V16A2.5 2.5 0 0 1 4 13.5Z" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"></path></svg>
    <span>{{ fabLabel }}</span>
    <sc-if value="{{ hasUnread }}"><span class="chat-badge">{{ unread }}</span></sc-if>
  </button>
</sc-if>
<sc-if value="{{ chatOpen }}">
  <section class="chat-panel" role="dialog" aria-label="Discussion">
    <header class="chat-head">
      <div style="min-width:0;flex:1">
        <div style="font-family:var(--font-heading);font-size:18px;line-height:1.1">Discussion</div>
        <div class="text-muted" style="font-size:12px;margin-top:2px">{{ statusLine }}<sc-if value="{{ hasRoomLink }}"> · <a href="{{ roomLink }}" target="_blank" rel="noopener noreferrer" style="color:inherit" title="This room, outside this page">open elsewhere ↗</a></sc-if></div>
      </div>
      <button class="chat-me" sc-camel-on-click="{{ openIdentity }}" title="Your chat identity">
        <span class="chat-dot" style="background:{{ myColor }}"></span><span class="chat-me-name">{{ myName }}</span>
      </button>
      <button class="btn btn-icon btn-ghost" sc-camel-on-click="{{ toggleChat }}" aria-label="Close the discussion" style="font-size:16px;flex:none">✕</button>
    </header>

    <div class="chat-tabs">
      <div class="seg">
        <button class="seg-opt" sc-camel-on-click="{{ tabs.showPublic }}" style="background:{{ tabs.publicBg }};color:{{ tabs.publicFg }};border:0;font:inherit;font-size:13px;cursor:pointer">Public</button>
        <button class="seg-opt" sc-camel-on-click="{{ tabs.showMembers }}" style="background:{{ tabs.membersBg }};color:{{ tabs.membersFg }};border:0;font:inherit;font-size:13px;cursor:pointer">Members<span style="font-size:11px;opacity:.7;margin-left:6px">{{ tabs.membersNote }}</span></button>
      </div>
    </div>

    <sc-if value="{{ hasTopic }}">
      <div class="chat-topic">
        <button class="chat-ref" sc-camel-on-click="{{ openTopic }}" title="Show the proposal">#{{ topicId }} · {{ topicTitle }}</button>
        <button class="btn btn-ghost" sc-camel-on-click="{{ clearTopic }}" style="font-size:12px;padding:4px 8px;flex:none">all messages</button>
      </div>
    </sc-if>

    <sc-if value="{{ showMembers }}">
      <div class="chat-topic">
        <span class="text-muted" style="font-size:12.5px">{{ membersLine }}</span>
        <button class="btn btn-ghost" sc-camel-on-click="{{ openMembers }}" style="font-size:12px;padding:4px 8px;flex:none">who is here</button>
      </div>
    </sc-if>
    <div class="chat-log" id="chat-log">
      <sc-if value="{{ showFailed }}">
        <div class="chat-gate"><div class="chat-gate-title">Could not load the chat</div><p class="text-muted" style="margin:0;font-size:13px">{{ failedText }}</p></div>
      </sc-if>
      <sc-if value="{{ showGate }}">
        <div class="chat-gate">
          <div class="chat-gate-title">{{ gateTitle }}</div>
          <p style="margin:0 0 12px;font-size:13.5px;line-height:1.55;opacity:.85">{{ gateText }}</p>
          <sc-if value="{{ hasGateAction }}"><button class="btn btn-primary" sc-camel-on-click="{{ gateRun }}" style="font-size:13px">{{ gateAction }}</button></sc-if>
          <sc-if value="{{ busy }}"><span class="text-muted" style="font-size:12.5px">{{ busyLabel }}</span></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ showEmpty }}">
        <p class="text-muted" style="margin:auto;text-align:center;font-size:13.5px;padding:24px">{{ emptyText }}</p>
      </sc-if>
      <sc-for list="{{ messages }}" as="m">
        <div class="chat-msg">
          <sc-if value="{{ m.showHead }}">
            <div class="chat-msg-head">
              <span class="chat-dot" style="background:{{ m.color }}"></span>
              <button class="chat-name" sc-camel-on-click="{{ m.openProfile }}" style="color:{{ m.color }}" title="Who is this?">{{ m.name }}</button>
              <sc-if value="{{ m.online }}"><span class="chat-online" title="Here now"></span></sc-if>
              <sc-if value="{{ m.member }}"><span class="chat-member" title="A wallet holding a position in the pool has signed for this identity">member</span></sc-if>
              <span class="chat-time">{{ m.time }}</span>
            </div>
          </sc-if>
          <div class="chat-row"><div class="chat-bubble" style="background:{{ m.bg }}"><sc-for list="{{ m.parts }}" as="s"><sc-if value="{{ s.plain }}">{{ s.text }}</sc-if><sc-if value="{{ s.href }}"><a href="{{ s.href }}" target="_blank" rel="noopener noreferrer">{{ s.text }}</a></sc-if></sc-for></div><sc-if value="{{ m.canReact }}"><button class="chat-out" sc-camel-on-click="{{ m.react }}" title="React">☺+</button></sc-if><sc-if value="{{ m.hasLink }}"><a class="chat-out" href="{{ m.link }}" target="_blank" rel="noopener noreferrer" title="This message on njump">↗</a></sc-if></div>
          <sc-if value="{{ m.hasReactions }}">
            <div class="chat-reactions"><sc-for list="{{ m.reactions }}" as="r"><button class="chat-reaction" sc-camel-on-click="{{ r.toggle }}" style="background:{{ r.bg }};border-color:{{ r.border }}" title="{{ r.who }}">{{ r.emoji }} <span>{{ r.count }}</span></button></sc-for></div>
          </sc-if>
          <sc-if value="{{ m.hasProposal }}"><button class="chat-ref" sc-camel-on-click="{{ m.openProposal }}">#{{ m.proposal }} · {{ m.proposalTitle }}</button></sc-if>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{ hasNotice }}">
      <div class="chat-notice"><span style="flex:1">{{ notice }}</span><button class="btn btn-ghost" sc-camel-on-click="{{ clearNotice }}" style="font-size:12px;padding:2px 6px">✕</button></div>
    </sc-if>

    <sc-if value="{{ pickerOpen }}">
      <div class="chat-picker">
        <div class="chat-picker-head"><span>{{ pickerTitle }}</span><button class="btn btn-ghost" sc-camel-on-click="{{ closePicker }}" style="font-size:12px;padding:2px 6px">✕</button></div>
        <sc-if value="{{ pickerQuick }}">
          <div class="chat-picker-quick"><sc-for list="{{ quick }}" as="e"><button class="chat-picker-emoji" sc-camel-on-click="{{ e.pick }}">{{ e.char }}</button></sc-for></div>
        </sc-if>
        <div class="chat-picker-grid"><sc-for list="{{ emojis }}" as="e"><button class="chat-picker-emoji" sc-camel-on-click="{{ e.pick }}" title="{{ e.name }}">{{ e.char }}</button></sc-for></div>
      </div>
    </sc-if>

    <sc-if value="{{ canWrite }}">
      <div class="chat-compose">
        <button class="chat-emoji-btn" sc-camel-on-click="{{ togglePicker }}" title="Emoji" aria-label="Add an emoji">☺</button>
        <textarea class="input" id="chat-input" rows="1" placeholder="{{ placeholder }}" autocomplete="off" aria-label="Message">{{ draft }}</textarea>
        <button class="btn btn-primary" sc-camel-on-click="{{ send }}" style="font-size:13px;flex:none">{{ sendLabel }}</button>
      </div>
      <div class="chat-foot text-muted">{{ footLine }}</div>
    </sc-if>

    <sc-if value="{{ sheetOpen }}">
      <div class="chat-sheet-backdrop" sc-camel-on-click="{{ closeSheet }}"></div>
      <div class="chat-sheet">
        <sc-if value="{{ sheetIdentity }}">
          <div class="chat-sheet-head"><span>Your chat identity</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <div style="display:flex;align-items:center;gap:12px">
            <span class="chat-dot" style="background:{{ myColor }};width:34px;height:34px"></span>
            <div style="min-width:0">
              <div style="font-family:var(--font-heading);font-size:17px">{{ myName }}</div>
              <div class="text-muted" style="font-family:ui-monospace,monospace;font-size:11.5px;overflow-wrap:anywhere">{{ myKey }}</div>
            </div>
          </div>
          <sc-if value="{{ canRename }}">
            <div class="field">
              <label for="chat-name">Display name</label>
              <div style="display:flex;gap:8px">
                <input class="input" id="chat-name" value="{{ nameDraft }}" placeholder="{{ myName }}" maxlength="40" autocomplete="off">
                <button class="btn btn-secondary" sc-camel-on-click="{{ saveName }}" style="font-size:13px;flex:none">Save</button>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ cannotRename }}">
            <p class="text-muted" style="margin:0;font-size:13px">Your name comes with the key you brought. Change it where that key lives.</p>
          </sc-if>
          <div class="chat-verified">
            <sc-if value="{{ verifiedOk }}"><span style="color:var(--color-accent-2-700)">✓</span></sc-if>
            <span style="flex:1">{{ verifiedLine }}</span>
            <sc-if value="{{ showVerify }}"><button class="btn btn-primary" sc-camel-on-click="{{ verify }}" style="font-size:12.5px;padding:6px 12px">{{ verifyLabel }}</button></sc-if>
          </div>
          <sc-if value="{{ busy }}"><p class="text-muted" style="margin:0;font-size:12.5px">{{ busyLabel }}</p></sc-if>
          <p class="text-muted" style="margin:0;font-size:13px;line-height:1.5">{{ identityKind }}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <sc-if value="{{ canBackup }}"><button class="btn btn-secondary" sc-camel-on-click="{{ openBackup }}" style="font-size:13px">Back up this key</button></sc-if>
            <button class="btn btn-secondary" sc-camel-on-click="{{ openBring }}" style="font-size:13px">Bring your own key</button>
            <button class="btn btn-ghost" sc-camel-on-click="{{ newKey }}" style="font-size:13px">Start over</button>
          </div>
        </sc-if>

        <sc-if value="{{ sheetBring }}">
          <div class="chat-sheet-head"><span>Bring your own key</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <p class="text-muted" style="margin:0;font-size:13px;line-height:1.5">The chat runs on Nostr. If you already have a Nostr identity you can use it here, and your name and messages follow you between devices.</p>
          <sc-if value="{{ hasExtension }}"><button class="btn btn-secondary" sc-camel-on-click="{{ useExtension }}" style="font-size:13px;align-self:flex-start">Use the browser extension</button></sc-if>
          <sc-if value="{{ noExtension }}"><p class="text-muted" style="margin:0;font-size:12.5px">No signer extension was found in this browser (Alby, nos2x and the like).</p></sc-if>
          <div class="field">
            <label for="chat-bunker">Remote signer — Amber, nsec.app, a bunker</label>
            <div style="display:flex;gap:8px">
              <input class="input" id="chat-bunker" placeholder="bunker://…" autocomplete="off" spellcheck="false">
              <button class="btn btn-secondary" sc-camel-on-click="{{ useBunker }}" style="font-size:13px;flex:none">Connect</button>
            </div>
          </div>
          <sc-if value="{{ remoteWaiting }}">
            <div class="chat-gate" style="gap:8px">
              <div style="font-size:13px">Open this link with your signer, then come back. Waiting…</div>
              <a class="btn btn-primary" href="{{ remoteUri }}" style="font-size:13px;align-self:flex-start">Open in Amber</a>
              <code style="font-size:11px;overflow-wrap:anywhere;opacity:.7">{{ remoteUri }}</code>
              <div style="display:flex;gap:8px"><button class="btn btn-secondary" sc-camel-on-click="{{ copyRemote }}" style="font-size:12.5px">Copy link</button><button class="btn btn-ghost" sc-camel-on-click="{{ cancelRemote }}" style="font-size:12.5px">Cancel</button></div>
            </div>
          </sc-if>
          <sc-if value="{{ remoteWaitingNot }}"><button class="btn btn-ghost" sc-camel-on-click="{{ startRemote }}" style="font-size:13px;align-self:flex-start">Or let the signer connect to this page ↗</button></sc-if>
          <div class="field">
            <label for="chat-nsec">A secret key you hold</label>
            <div style="display:flex;gap:8px">
              <input class="input" id="chat-nsec" type="password" placeholder="nsec1…" autocomplete="off">
              <button class="btn btn-secondary" sc-camel-on-click="{{ useNsec }}" style="font-size:13px;flex:none">Use it</button>
            </div>
          </div>
          <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.5">A key you paste is kept in this browser's storage, like the generated one. An extension or a remote signer keeps it out of the page altogether.</p>
          <sc-if value="{{ busy }}"><p class="text-muted" style="margin:0;font-size:12.5px">{{ busyLabel }}</p></sc-if>
        </sc-if>

        <sc-if value="{{ sheetBackup }}">
          <div class="chat-sheet-head"><span>Back up this key</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <p style="margin:0;font-size:13.5px;line-height:1.5">Anyone holding this secret can write as you. Keep it somewhere private; paste it into another browser, or a Nostr app, to be the same person there.</p>
          <!-- Covered until it is asked for. Copy works either way, so the key
               can go straight into a password manager without ever being on
               screen. -->
          <div style="display:flex;gap:8px;align-items:stretch">
            <code style="flex:1;min-width:0;font-size:12px;overflow-wrap:anywhere;padding:10px 12px;background:var(--color-surface);border-radius:var(--radius-md);display:block">{{ nsecText }}</code>
            <button class="btn btn-ghost" sc-camel-on-click="{{ toggleNsec }}" aria-label="{{ revealLabel }}" title="{{ revealLabel }}" style="flex:none;padding:0 12px;border-radius:var(--radius-md);display:flex;align-items:center">
              <sc-if value="{{ nsecHidden }}">
                <svg width="19" height="19" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="display:block"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" style="fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round"></path><circle cx="12" cy="12" r="2.8" style="fill:none;stroke:currentColor;stroke-width:1.7"></circle></svg>
              </sc-if>
              <sc-if value="{{ nsecShown }}">
                <svg width="19" height="19" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="display:block"><path d="M2 12s3.6-6.5 10-6.5c1.7 0 3.2.5 4.5 1.1M22 12s-3.6 6.5-10 6.5c-1.7 0-3.2-.5-4.5-1.1" style="fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round"></path><path d="M4 4l16 16" style="fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round"></path></svg>
              </sc-if>
            </button>
          </div>
          <p class="text-muted" style="margin:-4px 0 0;font-size:12px;line-height:1.5">Hidden until you press the eye, so it is never on screen by accident.</p>
          <div style="display:flex;gap:8px"><button class="btn btn-secondary" sc-camel-on-click="{{ copyNsec }}" style="font-size:13px">Copy</button><button class="btn btn-ghost" sc-camel-on-click="{{ openIdentity }}" style="font-size:13px">Back</button></div>
        </sc-if>

        <sc-if value="{{ sheetMembers }}">
          <div class="chat-sheet-head"><span>Who is here</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.5">{{ membersLine }}. Every wallet that has signed for a chat key, whether or not the pool counts it a member. Online means their page has said so in the last two minutes.</p>
          <div class="chat-people">
            <sc-for list="{{ people }}" as="p">
              <button class="chat-person" sc-camel-on-click="{{ p.open }}">
                <span class="chat-dot" style="background:{{ p.color }};width:14px;height:14px"></span>
                <span style="min-width:0;flex:1">
                  <span style="display:flex;align-items:center;gap:6px;font-family:var(--font-heading);font-size:14px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ p.name }}</span><sc-if value="{{ p.isMe }}"><span class="text-muted" style="font-family:var(--font-body);font-size:11px">you</span></sc-if><sc-if value="{{ p.online }}"><span class="chat-online"></span></sc-if></span>
                  <span class="text-muted" style="display:block;font-family:ui-monospace,monospace;font-size:11px">{{ p.addressShort }} · {{ p.npubShort }}</span>
                </span>
                <sc-if value="{{ p.member }}"><span class="chat-member">member</span></sc-if>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ sheetProfile }}">
          <div class="chat-sheet-head"><span>{{ profile.name }}</span><button class="btn btn-ghost" sc-camel-on-click="{{ closeSheet }}" style="font-size:13px;padding:2px 8px">✕</button></div>
          <div style="display:flex;align-items:center;gap:12px">
            <span class="chat-dot" style="background:{{ profile.color }};width:34px;height:34px"></span>
            <div style="min-width:0">
              <div style="display:flex;align-items:center;gap:8px;font-size:13.5px"><sc-if value="{{ profile.online }}"><span class="chat-online"></span></sc-if>{{ profile.onlineLabel }}<sc-if value="{{ profile.isMe }}"><span class="text-muted">· you</span></sc-if></div>
              <div class="text-muted" style="font-size:12.5px">{{ profile.memberLabel }}</div>
            </div>
          </div>
          <sc-if value="{{ profile.linked }}">
            <div class="chat-verified" style="flex-direction:column;align-items:stretch;gap:4px">
              <span class="text-muted" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">Stacks address</span>
              <code style="font-size:12px;overflow-wrap:anywhere">{{ profile.address }}</code>
              <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" sc-camel-on-click="{{ profile.copyAddress }}" style="font-size:12px;padding:5px 11px">Copy</button><a class="btn btn-secondary" href="{{ profile.explorer }}" target="_blank" rel="noopener noreferrer" style="font-size:12px;padding:5px 11px">Explorer ↗</a></div>
            </div>
          </sc-if>

  <svg width="100%" height="100%" aria-hidden="true" style="position:absolute;inset:0;opacity:.5;-webkit-mask-image:radial-gradient(120% 100% at 88% 50%, #000 30%, color-mix(in srgb, #000 22%, transparent) 68%);mask-image:radial-gradient(120% 100% at 88% 50%, #000 30%, color-mix(in srgb, #000 22%, transparent) 68%)">

  <div style="position:relative;max-width:1240px;margin:0 auto;padding:clamp(44px,8vw,104px) clamp(20px,4vw,40px) clamp(52px,8vw,110px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,5vw,64px);align-items:center">

<section style="max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(20px,4vw,40px)">

  <div style="margin-top:clamp(14px,2vw,20px);background:var(--color-surface);border-radius:28px;padding:clamp(18px,3vw,26px) clamp(20px,3vw,30px);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between">

<section style="max-width:1240px;margin:0 auto;padding:clamp(40px,7vw,88px) clamp(20px,4vw,40px)">
  <h2 style="font-size:clamp(28px,4.2vw,46px);max-width:20ch;margin:0 0 10px">The name is not decoration. It is the model.</h2>
  <p class="text-muted" style="max-width:56ch;margin:0 0 clamp(24px,4vw,40px);font-size:16px">Esbee is a bee, and a bee was already what this contract is.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:clamp(12px,2vw,20px)">
    <div class="card elev-sm" style="padding:clamp(22px,3vw,30px);gap:10px">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--color-accent-200);display:grid;place-items:center;font-family:var(--font-heading);color:var(--color-accent-800);font-size:18px">01</div>
      <h3 style="margin:6px 0 0;font-size:23px">The hive</h3>
      <p style="margin:0;font-size:15px;line-height:1.55;opacity:.85">A membership that acts as one. That is what a DAO claims to be, and what quadratic weight is trying to make true rather than assume.</p>
    </div>
    <div class="card elev-sm" style="padding:clamp(22px,3vw,30px);gap:10px">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-200);display:grid;place-items:center;font-family:var(--font-heading);color:var(--color-accent-2-800);font-size:18px">02</div>
      <h3 style="margin:6px 0 0;font-size:23px">Workers and store</h3>
      <p style="margin:0;font-size:15px;line-height:1.55;opacity:.85">Workers put in; the store holds. Members deposit sBTC and STX, the treasury holds the principal, and the ledger never has to net a reserve off a payout.</p>
    </div>
    <div class="card elev-sm" style="padding:clamp(22px,3vw,30px);gap:10px">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--color-accent-200);display:grid;place-items:center;font-family:var(--font-heading);color:var(--color-accent-800);font-size:18px">03</div>
      <h3 style="margin:6px 0 0;font-size:23px">Honey</h3>
      <p style="margin:0;font-size:15px;line-height:1.55;opacity:.85">Yield that accrues slowly and is drawn down later — which is a six-month bond, almost exactly. It is split by shares, not by who is standing there when it lands.</p>
    </div>

<section id="pool" style="background:var(--color-surface);position:relative;overflow:hidden">
  <div style="max-width:1240px;margin:0 auto;padding:clamp(44px,7vw,96px) clamp(20px,4vw,40px)">
    <h2 style="font-size:clamp(28px,4.2vw,46px);margin:0 0 10px;max-width:18ch">How the pool works</h2>
    <p class="text-muted" style="max-width:58ch;margin:0 0 clamp(28px,4vw,48px);font-size:16px">Each bond the pool stakes into is an epoch. pox-5 lets one bond's term end exactly where the next begins, so the pool rolls straight across — moving only the net difference and resizing the STX lock in place.</p>

    <div style="background:var(--color-bg);border-radius:28px;padding:clamp(22px,4vw,38px);margin-bottom:clamp(16px,2.5vw,26px)">
      <div style="display:flex;gap:6px;align-items:stretch;flex-wrap:wrap">
        <div style="flex:1 1 180px;background:var(--color-accent-200);border-radius:20px;padding:16px 20px">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800);opacity:.8">Bond N</div>
          <div style="font-family:var(--font-heading);font-size:20px;margin-top:4px">Epoch 1</div>
        </div>
        <div style="flex:0 0 auto;display:grid;place-items:center;padding:0 4px">
          <div style="font-family:var(--font-heading);font-size:12px;color:var(--color-accent);writing-mode:horizontal-tb;text-align:center">roll ⟶</div>
        </div>
        <div style="flex:1 1 180px;background:var(--color-accent-300);border-radius:20px;padding:16px 20px">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800);opacity:.8">Bond N+6</div>
          <div style="font-family:var(--font-heading);font-size:20px;margin-top:4px">Epoch 2</div>
        </div>
        <div style="flex:0 0 auto;display:grid;place-items:center;padding:0 4px">
          <div style="font-family:var(--font-heading);font-size:12px;color:var(--color-accent);text-align:center">roll ⟶</div>
        </div>
        <div style="flex:1 1 180px;background:var(--color-accent-200);border-radius:20px;padding:16px 20px">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800);opacity:.8">Bond N+12</div>
          <div style="font-family:var(--font-heading);font-size:20px;margin-top:4px">Epoch 3</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;margin-top:22px">
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.85"><strong style="font-family:var(--font-heading);font-weight:400">Positions move at the roll,</strong> so your record never describes a position the pool has already left.</p>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.85"><strong style="font-family:var(--font-heading);font-weight:400">Rewards move when an epoch settles,</strong> a cycle later — so the bond you were actually in is the one that pays you.</p>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.85"><strong style="font-family:var(--font-heading);font-weight:400">A stash bridges the gap.</strong> Leave at a roll and you get your principal back at once, and the final cycle's honey when it arrives.</p>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(12px,2vw,20px)">
      <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px)">
        <span class="tag tag-accent">sats</span>
        <h4 style="margin:12px 0 6px;font-size:21px">What you get back</h4>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.8">The sBTC you deposited. It is held by the treasury as principal, never as reward.</p>
      </div>
      <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px)">
        <span class="tag tag-accent-2">ustx</span>
        <h4 style="margin:12px 0 6px;font-size:21px">The other leg</h4>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.8">Every bond prices sats in STX. pox-5 locks the staker's STX, so the pool holds it and returns it on Stacks.</p>
      </div>
      <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px)">
        <span class="tag tag-neutral">shares</span>
        <h4 style="margin:12px 0 6px;font-size:21px">Your weight in an epoch</h4>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.8">One share per committed satoshi, struck at the roll. Leave at a roll and you keep the shares of the epoch you were part of — and its final honey. Leave <em>early</em> and the shares go with the sats, which is what makes the split honest for whoever stays.</p>
      </div>
    </div>

    <!-- The deposit itself is a page now, not the tail of this one.

         What used to sit here was an amount field, two balances, a bridge
         route with five steps and a position card -- everything a member
         *does* -- underneath two screens explaining to somebody who has not
         decided yet what a pool is. Reading and doing are different visits,
         and they were sharing a scroll: a member coming back to check on
         their sats had to pass the whole explanation to reach them.

         So this is the door, and `app.html` is the room. -->
    <div style="margin-top:clamp(36px,5vw,60px);background:var(--color-bg);border-radius:28px;padding:clamp(24px,3.5vw,36px);display:flex;flex-wrap:wrap;gap:clamp(18px,3vw,32px);align-items:center;justify-content:space-between">
      <div style="flex:1 1 360px;min-width:0">
        <h3 id="join" style="font-size:clamp(22px,3vw,32px);margin:0 0 6px">Put bitcoin in the pool</h3>
        <p class="text-muted" style="margin:0;font-size:15px;line-height:1.6;max-width:60ch">Deposit sBTC you already hold, or send bitcoin from your own wallet and let the bridge turn it into sBTC. Both end up in the same place, and every deposit needs some STX alongside it. Until the pool stakes, your deposit stays yours — withdraw it any time.</p>
        <!-- A member who already has one is not being sold anything; they are
             being pointed back at it. -->
        <sc-if value="{{ posShow }}">
          <p style="margin:10px 0 0;font-size:14px;line-height:1.6">You already hold a position here — it is on that page, with what you can withdraw and claim.</p>
        </sc-if>
      </div>
      <div style="flex:none;display:flex;flex-direction:column;gap:8px;align-items:flex-start">
        <a class="btn btn-primary" href="app.html" style="font-size:15px;padding:11px 22px">{{ joinCta }}</a>
        <span class="text-muted" style="font-size:12.5px">The amount, both routes, and your position.</span>
      </div>
    </div>

  </div>
</section>

<section id="govern" style="max-width:1240px;margin:0 auto;padding:clamp(44px,7vw,96px) clamp(20px,4vw,40px)">
  <h2 style="font-size:clamp(28px,4.2vw,46px);margin:0 0 10px;max-width:20ch">Governance: the seat, held by the hive</h2>
  <p class="text-muted" style="max-width:60ch;margin:0 0 clamp(28px,4vw,46px);font-size:16px">The operator seat can be held by a contract instead of a key. <code style="font-family:ui-monospace,monospace;font-size:14px">esbee-dao</code> puts five of the operator's powers behind a vote of the pool's own members.</p>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(16px,3vw,32px);align-items:start;margin-bottom:clamp(36px,5vw,64px)">
    <div>
      <h3 style="font-size:clamp(21px,2.6vw,28px);margin:0 0 8px">Weight is the square root of your sats</h3>
      <p style="margin:0 0 18px;font-size:15px;line-height:1.6;opacity:.85">A member ten thousand times larger gets a hundred times the say, not ten thousand. And only committed shares count — a queued deposit is withdrawable on demand, so counting it would let anyone rent a majority for one transaction.</p>
      <p class="text-muted" style="margin:0;font-size:13.5px;line-height:1.55">Deposit, vote, withdraw is not a strategy here. It is a no-op.</p>
    </div>
    <div style="background:var(--color-surface);border-radius:28px;padding:clamp(22px,3vw,30px);display:flex;flex-direction:column;gap:18px">
      <sc-for list="{{ weightDemo }}" as="row" hint-placeholder-count="3">
        <div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="font-family:var(--font-heading)">{{ row.label }}</span><span class="text-muted">weight {{ row.weight }}</span></div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <div style="height:9px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--color-neutral-600);width:{{ row.stakeW }}"></div></div>
            <div style="height:9px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--color-accent);width:{{ row.sayW }}"></div></div>
          </div>
        </div>
      </sc-for>
      <div style="display:flex;gap:16px;font-size:12px" class="text-muted">
        <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:var(--color-neutral-600)"></span>stake</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:var(--color-accent)"></span>say</span>
      </div>
    </div>
  </div>

  <h3 style="font-size:clamp(21px,2.8vw,30px);margin:0 0 6px">Six powers, one mandate each</h3>
  <p class="text-muted" style="margin:0 0 22px;font-size:15px;max-width:58ch">Every proposal is a set of parameters for one operator call, raised through a typed entry point — so a mandate won for one power can never be spent on another.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:12px;margin-bottom:clamp(36px,5vw,60px)">
    <sc-for list="{{ powers }}" as="p" hint-placeholder-count="5">
      <div class="card" style="padding:20px 22px;gap:6px;background:var(--color-surface)">
        <code style="font-family:ui-monospace,monospace;font-size:12px;color:var(--color-accent-700)">{{ p.call }}</code>
        <div style="font-family:var(--font-heading);font-size:17px;line-height:1.2">{{ p.title }}</div>
        <p style="margin:0;font-size:13px;line-height:1.55;opacity:.78">{{ p.body }}</p>
      </div>
    </sc-for>
  </div>
  <div style="background:var(--color-accent-2-200);border-radius:28px;padding:clamp(22px,3vw,30px);display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:clamp(36px,5vw,60px)">
    <div style="flex:1 1 300px">
      <h4 style="margin:0 0 6px;font-size:20px;color:var(--color-accent-2-900)">Binding a bond is deliberately not one of them</h4>
      <p style="margin:0;font-size:14.5px;line-height:1.6;color:var(--color-accent-2-900);opacity:.85"><code style="font-family:ui-monospace,monospace;font-size:13.5px">bind-bond</code> has to land inside a window pox-5 fixes, and a vote that takes a voting period plus an execution delay to clear cannot be relied on to hit it. The seat holds both: a key that binds, and the DAO for everything a vote can be trusted to time.</p>
    </div>
  </div>

  <h3 style="font-size:clamp(21px,2.8vw,30px);margin:0 0 6px">Six gates. A proposal clears all of them or none.</h3>
  <p class="text-muted" style="margin:0 0 22px;font-size:15px;max-width:58ch">Every gate is returned as its own field, so you can see which line a proposal is still behind rather than a bare pass or fail.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px">
    <sc-for list="{{ gates }}" as="g" hint-placeholder-count="6">
      <div style="background:var(--color-surface);border-radius:24px;padding:22px;display:flex;gap:14px;align-items:flex-start">
        <svg sc-camel-view-box="0 0 52 52" style="width:40px;flex:none">
          <path d="M26 3 L47 15 L47 37 L26 49 L5 37 L5 15 Z" style="fill:none;stroke:var(--color-accent);stroke-width:2.75;stroke-linejoin:round"></path>
          <text x="26" y="33" text-anchor="middle" style="font-family:var(--font-heading);font-size:19px;fill:var(--color-accent-800)">{{ g.n }}</text>
        </svg>
        <div>
          <div style="font-family:var(--font-heading);font-size:17px;line-height:1.2;margin-bottom:4px">{{ g.label }}</div>
          <p style="margin:0;font-size:13px;line-height:1.55;opacity:.78">{{ g.body }}</p>
        </div>
      </div>
    </sc-for>
  </div>
</section>

<section id="vote" style="background:var(--color-surface);position:relative">
  <div style="max-width:1240px;margin:0 auto;padding:clamp(44px,7vw,96px) clamp(20px,4vw,40px)">
    <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:8px">
      <h2 style="font-size:clamp(28px,4.2vw,46px);margin:0;max-width:16ch">The vote floor</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <sc-if value="{{ dummy }}" hint-placeholder-val="{{ true }}">
          <span class="tag tag-neutral" style="font-size:12px;padding:6px 14px">Dummy proposals · nothing on chain</span>
        </sc-if>
        <sc-if value="{{ rehearsalShow }}" hint-placeholder-val="{{ true }}">
          <span class="tag tag-accent-2" style="font-size:12px;padding:6px 14px">{{ rehearsalNote }}</span>
        </sc-if>
        <div class="seg" style="flex:none">
          <sc-for list="{{ sources }}" as="s" hint-placeholder-count="2">
            <button class="seg-opt" sc-camel-on-click="{{ s.choose }}" title="{{ s.note }}" style="background:{{ s.bg }};color:{{ s.fg }};border:0;font:inherit;font-size:12.5px;cursor:pointer">{{ s.label }}</button>
          </sc-for>
        </div>
      </div>
    </div>
    <p class="text-muted" style="max-width:60ch;margin:0 0 10px;font-size:16px">{{ voteIntro }}</p>
    <!-- What it takes to raise one. The contract wants weight and a live epoch,
         and before the first roll nobody has either -- so the answer to "how do
         I propose" is a sentence, not a button. -->
    <p class="text-muted" style="max-width:60ch;margin:0 0 clamp(24px,4vw,38px);font-size:13.5px;line-height:1.55;opacity:.75">{{ proposeNote }}</p>

    <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:clamp(16px,2.5vw,24px)">
      <sc-if value="{{ connected }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,44px);align-items:center">
          <div style="display:flex;align-items:center;gap:12px">
            <span style="width:40px;height:40px;border-radius:50%;background:var(--color-accent-300);display:grid;place-items:center;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-900)">SP</span>
            <div>
              <div style="font-family:ui-monospace,monospace;font-size:13.5px">{{ walletLabel }}</div>
              <div class="text-muted" style="font-size:12px">{{ network }}</div>
            </div>
          </div>
          <div>
            <div class="text-muted" style="font-size:11px;letter-spacing:.09em;text-transform:uppercase">Committed sats</div>
            <div style="font-family:var(--font-heading);font-size:22px">{{ memberSatsLabel }}</div>
          </div>
          <div>
            <div class="text-muted" style="font-size:11px;letter-spacing:.09em;text-transform:uppercase">Your weight</div>
            <div style="font-family:var(--font-heading);font-size:22px;color:var(--color-accent-700)">{{ memberWeight }}</div>
          </div>
          <div>
            <div class="text-muted" style="font-size:11px;letter-spacing:.09em;text-transform:uppercase">Share of the hive</div>
            <div style="font-family:var(--font-heading);font-size:22px">{{ memberShare }}</div>
          </div>
        </div>
        <!-- Three zeros with nothing beside them read as "my deposit is gone".
             This is the sentence that says where it actually is. -->
        <p class="text-muted" style="flex:1 1 100%;margin:0;font-size:12.5px;line-height:1.5;max-width:64ch">{{ weightNote }}</p>
        <button class="btn btn-secondary" sc-camel-on-click="{{ disconnect }}" style="font-size:13px">Disconnect</button>
      </sc-if>
      <sc-if value="{{ disconnected }}" hint-placeholder-val="{{ true }}">
        <div>
          <div style="font-family:var(--font-heading);font-size:20px">No wallet connected</div>
          <p class="text-muted" style="margin:4px 0 0;font-size:14px;max-width:46ch">Proposals and tallies read straight from the node. Only casting a vote needs a wallet.</p>
        </div>
        <button class="btn btn-primary" sc-camel-on-click="{{ openWallet }}" style="font-size:14px;padding:11px 22px">Connect wallet</button>
      </sc-if>
    </div>

    <!-- Raising one. `open-proposal` asserts a weight above zero and a live
         epoch, so the form only appears when the DAO would actually take a
         proposal from this member; the line above says why when it would not.
         The fields are uncontrolled and held across a render by `wireCompose`,
         the same way the deposit amount is. -->
    <sc-if value="{{ compose.show }}" hint-placeholder-val="{{ true }}">
      <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px);margin-bottom:clamp(16px,2.5vw,24px)">
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
          <div>
            <h4 style="margin:0;font-size:clamp(18px,2.2vw,22px)">Raise a proposal</h4>
            <p class="text-muted" style="margin:4px 0 0;font-size:13px">One mandate each. The hive votes; anyone may execute what carries.</p>
          </div>
          <button class="btn btn-secondary" sc-camel-on-click="{{ compose.toggle }}" style="font-size:13px;flex:none">{{ compose.toggleLabel }}</button>
        </div>
        <sc-if value="{{ compose.open }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:14px;margin-top:18px">
            <div class="seg" style="flex-wrap:wrap">
              <sc-for list="{{ compose.kinds }}" as="k" hint-placeholder-count="6">
                <button class="seg-opt" sc-camel-on-click="{{ k.choose }}" style="background:{{ k.bg }};color:{{ k.fg }};border:0;font:inherit;font-size:12.5px;cursor:pointer">{{ k.label }}</button>
              </sc-for>
            </div>
            <p class="text-muted" style="margin:0;font-size:13.5px;line-height:1.55;max-width:66ch">{{ compose.blurb }}</p>

            <sc-if value="{{ compose.needHash }}">
              <div>
                <label class="text-muted" style="font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px" for="compose-hash">Manager code hash</label>
                <input class="input" id="compose-hash" placeholder="0x… (64 hex characters)" autocomplete="off" spellcheck="false" style="width:100%">
              </div>
            </sc-if>
            <sc-if value="{{ compose.needManagers }}">
              <div style="display:flex;flex-direction:column;gap:12px">
                <div>
                  <label class="text-muted" style="font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px" for="compose-manager">Move the registration to</label>
                  <input class="input" id="compose-manager" placeholder="SP….signer-manager" autocomplete="off" spellcheck="false" style="width:100%">
                </div>
                <div>
                  <label class="text-muted" style="font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px" for="compose-old-manager">Replacing</label>
                  <input class="input" id="compose-old-manager" placeholder="SP….signer-manager" autocomplete="off" spellcheck="false" style="width:100%">
                </div>
              </div>
            </sc-if>
            <sc-if value="{{ compose.needOperator }}">
              <div style="display:flex;flex-direction:column;gap:12px">
                <div>
                  <label class="text-muted" style="font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px" for="compose-who">Operator address</label>
                  <input class="input" id="compose-who" placeholder="SP…" autocomplete="off" spellcheck="false" style="width:100%">
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
                  <button class="btn btn-secondary" sc-camel-on-click="{{ compose.toggleEnabled }}" style="font-size:12.5px;flex:none">{{ compose.enabledLabel }}</button>
                  <span class="text-muted" style="font-size:12.5px">{{ compose.enabledNote }}</span>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{ compose.needRecipient }}">
              <div>
                <label class="text-muted" style="font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px" for="compose-recipient">Send the stray to</label>
                <input class="input" id="compose-recipient" placeholder="SP…" autocomplete="off" spellcheck="false" style="width:100%">
              </div>
            </sc-if>
            <sc-if value="{{ compose.needIndex }}">
              <div>
                <label class="text-muted" style="font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px" for="compose-index">Earliest bond to bind</label>
                <input class="input" id="compose-index" inputmode="numeric" placeholder="0 clears the floor" autocomplete="off" style="width:100%">
              </div>
            </sc-if>

            <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.55;max-width:66ch">{{ compose.hint }}</p>
            <div>
              <button class="btn btn-primary" sc-camel-on-click="{{ compose.submit }}" style="font-size:14px;padding:11px 22px">Raise it</button>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ noSelection }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:12px">
        <sc-for list="{{ proposals }}" as="p" hint-placeholder-count="4">
          <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(16px,3vw,32px);align-items:center">
            <div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px">
                <span style="font-family:var(--font-heading);font-size:13px;color:var(--color-accent)">#{{ p.id }}</span>
                <span style="font-size:11.5px;letter-spacing:.03em;padding:4px 12px;border-radius:999px;background:{{ p.tone.bg }};color:{{ p.tone.fg }}">{{ p.state }}</span>
                <sc-if value="{{ p.dummy }}" hint-placeholder-val="{{ true }}">
                  <span class="tag tag-neutral" style="font-size:11.5px;padding:4px 12px;border-radius:999px">dummy</span>
                </sc-if>
                <code style="font-family:ui-monospace,monospace;font-size:11.5px;opacity:.6">{{ p.kind }}</code>
              </div>
              <h4 style="margin:0 0 6px;font-size:clamp(19px,2.2vw,24px);line-height:1.2">{{ p.title }}</h4>
              <p class="text-muted" style="margin:0;font-size:14px;line-height:1.55;max-width:54ch">{{ p.blurb }}</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px">
              <div>
                <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span style="color:var(--color-accent-2-700)">For {{ p.yesLabel }}</span><span class="text-muted">Against {{ p.noLabel }}</span></div>
                <div style="height:11px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden;display:flex">
                  <div style="height:100%;background:var(--color-accent-2-600);width:{{ p.yesW }}"></div>
                  <div style="height:100%;background:var(--color-accent-400);width:{{ p.noW }}"></div>
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                <sc-for list="{{ p.chips }}" as="c" hint-placeholder-count="3">
                  <span style="font-size:11.5px;padding:4px 11px;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }}">{{ c.text }}</span>
                </sc-for>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-secondary" sc-camel-on-click="{{ p.open }}" style="font-size:13px">Gate-by-gate</button>
                <button class="btn btn-secondary" sc-camel-on-click="{{ p.discuss }}" style="font-size:13px" title="Talk about this proposal">Discuss</button>
                <sc-if value="{{ p.canVote }}" hint-placeholder-val="{{ true }}">
                  <button class="btn btn-primary" sc-camel-on-click="{{ p.voteYes }}" style="font-size:13px">Vote for</button>
                  <button class="btn btn-secondary" sc-camel-on-click="{{ p.voteNo }}" style="font-size:13px">Against</button>
                </sc-if>
                <sc-if value="{{ p.showVoted }}" hint-placeholder-val="{{ false }}">
                  <span style="display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--color-accent-2-700);font-family:var(--font-heading)">✓ You voted {{ p.voted }} · {{ memberWeight }}</span>
                </sc-if>
              </div>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{ noProposals }}" hint-placeholder-val="{{ false }}">
          <div style="background:var(--color-bg);border-radius:28px;padding:clamp(20px,3vw,28px)">
            <div style="font-family:var(--font-heading);font-size:20px">Nothing on the live floor</div>
            <p class="text-muted" style="margin:5px 0 0;font-size:14px;line-height:1.55;max-width:52ch">{{ noProposalsWhy }}</p>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ hasSelection }}" hint-placeholder-val="{{ false }}">
      <div style="background:var(--color-bg);border-radius:28px;padding:clamp(22px,3.5vw,36px)">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px">
          <button class="btn btn-ghost" sc-camel-on-click="{{ closeDetail }}" style="font-size:13px">← All proposals</button>
          <button class="btn btn-secondary" sc-camel-on-click="{{ sel.discuss }}" style="font-size:13px">Discuss #{{ sel.id }}</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px">
          <span style="font-family:var(--font-heading);font-size:14px;color:var(--color-accent)">#{{ sel.id }}</span>
          <span style="font-size:12px;padding:5px 13px;border-radius:999px;background:{{ sel.tone.bg }};color:{{ sel.tone.fg }}">{{ sel.state }}</span>
          <sc-if value="{{ sel.dummy }}" hint-placeholder-val="{{ true }}">
            <span class="tag tag-neutral" style="font-size:12px;padding:5px 13px;border-radius:999px">dummy</span>
          </sc-if>
          <code style="font-family:ui-monospace,monospace;font-size:12px;opacity:.6">{{ sel.kind }}</code>
        </div>
        <h3 style="margin:0 0 10px;font-size:clamp(23px,3.2vw,34px);max-width:24ch">{{ sel.title }}</h3>
        <p style="margin:0 0 clamp(22px,3vw,32px);font-size:15.5px;line-height:1.6;max-width:64ch;opacity:.85">{{ sel.detail }}</p>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(18px,3vw,34px);align-items:start">
          <div>
            <h5 style="margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-accent);font-family:var(--font-body);font-weight:700">Tally</h5>
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="color:var(--color-accent-2-700)">For {{ sel.yesLabel }}</span><span class="text-muted">Against {{ sel.noLabel }}</span></div>
            <div style="height:14px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden;display:flex;margin-bottom:16px">
              <div style="height:100%;background:var(--color-accent-2-600);width:{{ sel.yesW }}"></div>
              <div style="height:100%;background:var(--color-accent-400);width:{{ sel.noW }}"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div style="background:var(--color-surface);border-radius:20px;padding:14px 16px">
                <div class="text-muted" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">Turnout</div>
                <div style="font-family:var(--font-heading);font-size:20px">{{ sel.turnout }}</div>
              </div>
              <div style="background:var(--color-surface);border-radius:20px;padding:14px 16px">
                <div class="text-muted" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">Approval</div>
                <div style="font-family:var(--font-heading);font-size:20px">{{ sel.approval }}</div>
              </div>
            </div>
            <sc-if value="{{ sel.canVote }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
                <button class="btn btn-primary" sc-camel-on-click="{{ sel.voteYes }}" style="font-size:14px;padding:11px 22px">Vote for · {{ memberWeight }}</button>
                <button class="btn btn-secondary" sc-camel-on-click="{{ sel.voteNo }}" style="font-size:14px;padding:11px 22px">Vote against</button>
              </div>
            </sc-if>
            <sc-if value="{{ sel.showVoted }}" hint-placeholder-val="{{ false }}">
              <div style="margin-top:16px;background:var(--color-accent-2-200);color:var(--color-accent-2-900);border-radius:20px;padding:13px 18px;font-size:14px">Your {{ memberWeight }} is counted <strong style="font-family:var(--font-heading);font-weight:400">{{ sel.voted }}</strong>. A vote is cast once, at the weight held when it was cast.</div>
            </sc-if>
            <sc-if value="{{ sel.needsWallet }}" hint-placeholder-val="{{ false }}">
              <button class="btn btn-primary" sc-camel-on-click="{{ openWallet }}" style="font-size:14px;padding:11px 22px;margin-top:16px">Connect to vote</button>
            </sc-if>
          </div>
          <div>
            <h5 style="margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-accent);font-family:var(--font-body);font-weight:700">The six gates</h5>
            <div style="display:flex;flex-direction:column;gap:8px">
              <sc-for list="{{ sel.gateRows }}" as="g" hint-placeholder-count="6">
                <div style="display:flex;gap:12px;align-items:center;background:var(--color-surface);border-radius:20px;padding:12px 16px">
                  <span style="flex:none;width:22px;height:22px;border-radius:50%;background:{{ g.dot }};display:grid;place-items:center;color:var(--color-bg);font-size:12px">{{ g.icon }}</span>
                  <span style="font-size:14px;flex:1">{{ g.label }}</span>
                  <span style="font-size:13px;font-family:var(--font-heading);color:{{ g.fg }}">{{ g.value }}</span>
                </div>
              </sc-for>
            </div>
            <p class="text-muted" style="margin:14px 0 0;font-size:13px;line-height:1.55">Execution is permissionless — the mandate is the vote, not the executor. Anyone can land a proposal that has cleared all six.</p>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
</section>

<section id="trust" style="max-width:1240px;margin:0 auto;padding:clamp(44px,7vw,96px) clamp(20px,4vw,40px)">
  <h2 style="font-size:clamp(28px,4.2vw,46px);margin:0 0 10px;max-width:22ch">What the operator cannot do</h2>
  <p class="text-muted" style="max-width:58ch;margin:0 0 clamp(26px,4vw,42px);font-size:16px">The operator picks bonds and signer managers. It never touches a deposit, and it cannot strand the pool by doing nothing.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px">
    <sc-for list="{{ trust }}" as="t" hint-placeholder-count="4">
      <div style="background:var(--color-surface);border-radius:28px;padding:clamp(20px,3vw,28px)">
        <div style="font-family:var(--font-heading);font-size:18px;margin-bottom:6px">{{ t.title }}</div>
        <p style="margin:0;font-size:14px;line-height:1.6;opacity:.8">{{ t.body }}</p>
      </div>
    </sc-for>
  </div>

  <h3 style="font-size:clamp(21px,2.8vw,30px);margin:clamp(40px,5vw,64px) 0 18px">Questions worth asking</h3>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(12px,2vw,20px)">
    <sc-for list="{{ faq }}" as="f" hint-placeholder-count="6">
      <!-- The id is the question's own anchor, and the margin clears the sticky
           header a link from elsewhere on the page would otherwise scroll it under. -->
      <div id="{{ f.id }}" style="border-top:1px solid var(--color-divider);padding:18px 0">
        <div style="font-family:var(--font-heading);font-size:18px;margin-bottom:6px;line-height:1.25">{{ f.q }}</div>
        <p style="margin:0;font-size:14.5px;line-height:1.6;opacity:.82">{{ f.a }}</p>
      </div>
    </sc-for>
  </div>
</section>

<footer style="background:var(--color-neutral-900);color:var(--color-neutral-200);position:relative;overflow:hidden">
  <svg width="100%" height="100%" aria-hidden="true" style="position:absolute;inset:0;opacity:.16">
    <defs>
      <pattern id="combFoot" width="51.96" height="90" sc-camel-pattern-units="userSpaceOnUse">
        <g style="fill:none;stroke:var(--color-accent-400);stroke-width:1.2">
          <path d="M25.98 -30 L51.96 -15 L51.96 15 L25.98 30 L0 15 L0 -15 Z"></path>
          <path d="M0 15 L25.98 30 L25.98 60 L0 75 L-25.98 60 L-25.98 30 Z"></path>
          <path d="M51.96 15 L77.94 30 L77.94 60 L51.96 75 L25.98 60 L25.98 30 Z"></path>
          <path d="M25.98 60 L51.96 75 L51.96 105 L25.98 120 L0 105 L0 75 Z"></path>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#combFoot)"></rect>
  </svg>
  <!-- Four columns, not five. The fifth was the status note, which never fit
       beside the others and dropped onto a row of its own -- one narrow
       paragraph and two thirds of an empty line under everything else. It
       reads as what it is down in the bottom bar, and the footer is a row
       shorter for it. -->
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:clamp(32px,4.5vw,52px) clamp(20px,4vw,40px) clamp(20px,3vw,28px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(20px,3vw,40px)">
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <svg width="30" height="30" sc-camel-view-box="0 0 64 64" style="display:block">
          <path d="M32 3 L59 18 L59 46 L32 61 L5 46 L5 18 Z" style="fill:none;stroke:var(--color-neutral-200);stroke-width:3.4;stroke-linejoin:round"></path>
          <ellipse cx="32" cy="38" rx="9.5" ry="13" style="fill:var(--color-accent-400)"></ellipse>
          <path d="M23.6 33 h16.8 M24.4 42 h15.2" style="stroke:var(--color-neutral-900);stroke-width:3.2;stroke-linecap:round"></path>
          <circle cx="32" cy="24" r="5.4" style="fill:var(--color-neutral-200)"></circle>
        </svg>
        <span style="font-family:var(--font-heading);font-size:20px">Esbee DAO</span>
      </div>
      <p style="margin:0;font-size:13.5px;line-height:1.6;opacity:.6;max-width:34ch">A pooled staker for pox-5 Bitcoin Staking Bonds, with the operator seat held by its own members.</p>
    </div>
    <div>
      <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:12px">The pool</div>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
        <a href="#pool" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">How it works</a>
        <a href="app.html" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">Deposit &amp; position</a>
        <a href="#govern" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">Governance</a>
        <a href="#vote" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">Vote</a>
        <a href="#trust" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">Trust model</a>
        <a href="analytics.html" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">Analytics</a>
      </div>
    </div>
    <div>
      <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:12px">Brand</div>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
        <a href="media-kit.html" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">Media kit</a>
        <a href="media-kit.html#og" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">Social &amp; OG assets</a>
        <a href="media-kit.html#voice" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">Voice &amp; naming</a>
      </div>
    </div>
    <div>
      <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:12px">Source</div>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
        <a href="https://github.com/fastpool/sbtc-pool-bond-staker" target="_blank" rel="noopener" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">sbtc-pool-bond-staker ↗</a>
        <a href="https://github.com/fastpool/esbee-dao" target="_blank" rel="noopener" style="color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent-400)">esbee-dao ↗</a>
      </div>
      <p style="margin:10px 0 0;font-size:12.5px;line-height:1.6;opacity:.6;max-width:32ch">The contracts and this site. Read them before you deposit — that is the whole point of them being here.</p>
      <!-- Who wrote it, beside what they wrote. -->
      <p style="margin:8px 0 0;font-size:12.5px;line-height:1.6;opacity:.6;max-width:32ch">Built by <a href="https://fastpool.org" target="_blank" rel="noopener" style="color:var(--color-accent-400);text-decoration:none" style-hover="text-decoration:underline">Fast Pool</a> with the community, for the community.</p>
    </div>
  </div>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:14px clamp(20px,4vw,40px) clamp(18px,3vw,26px);border-top:1px solid color-mix(in srgb, var(--color-neutral-200) 14%, transparent);font-size:12.5px;line-height:1.6;opacity:.5;display:flex;flex-wrap:wrap;gap:4px 24px;align-items:baseline;justify-content:space-between">
    <span style="white-space:nowrap">A hive that holds the bond.</span>
    <span style="max-width:76ch">{{ statusNote }}</span>
  </div>
</footer>

<!-- Who you are here, behind the header button. It replaces a wallet
     chooser that listed three wallets and called the same `connect` for each
     of them: the wallet's own picker knows what is installed and this page
     does not, so there was nothing for the page's version to add. -->
<sc-if value="{{ walletOpen }}" hint-placeholder-val="{{ false }}">
  <div class="dialog-backdrop" style="z-index:60">
    <div class="dialog" style="gap:14px">
      <div class="dialog-title">Your account</div>
      <div style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:var(--radius-md);background:var(--color-surface)">
        <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">Stacks address</div>
        <span style="font-family:ui-monospace,monospace;font-size:12.5px;overflow-wrap:anywhere">{{ profileAddress }}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px">
        <div style="padding:12px 16px;background:var(--color-surface);border-radius:var(--radius-md)">
          <div style="font-family:var(--font-heading);font-size:19px">{{ join.committed }}</div>
          <div class="text-muted" style="font-size:12px">committed shares</div>
        </div>
        <div style="padding:12px 16px;background:var(--color-surface);border-radius:var(--radius-md)">
          <div style="font-family:var(--font-heading);font-size:19px">{{ join.queuedSats }}</div>
          <div class="text-muted" style="font-size:12px">queued deposit</div>
        </div>
        <div style="padding:12px 16px;background:var(--color-surface);border-radius:var(--radius-md)">
          <div style="font-family:var(--font-heading);font-size:19px">{{ memberWeight }}</div>
          <div class="text-muted" style="font-size:12px">voting power · {{ memberShare }} of the hive</div>
        </div>
      </div>
      <!-- The chat identity, which is a nostr key rather than this address.
           Worth showing here because it is the name other members see. -->
      <sc-if value="{{ beeShow }}">
        <div style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:var(--radius-md);background:var(--color-surface)">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">Your bee, in the discussion</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="width:10px;height:10px;border-radius:50%;background:{{ beeColor }};flex:none"></span>
            <span style="font-family:var(--font-heading);font-size:15px">{{ beeName }}</span>
            <code title="{{ beeNpubFull }}" style="font-family:ui-monospace,monospace;font-size:11.5px;opacity:.7;overflow-wrap:anywhere">{{ beeNpub }}</code>
          </div>
          <p class="text-muted" style="margin:0;font-size:12.5px;line-height:1.5">{{ beeLinked }}</p>
        </div>
      </sc-if>
      <div class="dialog-body" style="margin-bottom:2px">Reads work without a wallet. This one is needed to deposit, to vote, and to prove a chat identity is yours.</div>
      <div class="dialog-actions" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn btn-ghost" sc-camel-on-click="{{ closeWallet }}" style="font-size:13px">Close</button>
        <button class="btn btn-secondary" sc-camel-on-click="{{ disconnect }}" style="font-size:13px">Disconnect</button>
        <button class="btn btn-primary" sc-camel-on-click="{{ switchAccount }}" style="font-size:13px">Switch account</button>
      </div>
    </div>
  </div>
</sc-if>

</div>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
