<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-labelledby="title desc">
  <title id="title">Esbee</title>
  <desc id="desc">A honeycomb cell holding a bee.</desc>

  <!--
    The mark, and the only one: the same artwork the site's header draws
    inline, kept here as a file for the favicon and anywhere an image is
    wanted. `smoke-test.ts` compares the cell path against the header's so the
    two cannot drift apart.

    Colours are literal rather than CSS custom properties: a favicon is fetched
    as a standalone document, where the page's variables do not exist. They are
    the values `styles.css` defines, and they invert with the viewer's theme so
    the mark sits on a light or dark ground without a plate behind it.

    Mind the comments here. This file is parsed as XML, not HTML, so a double
    hyphen inside a comment is a parse error and the whole mark fails to
    render: an invalid favicon simply does not appear.
  -->
  <style>
    .cell   { fill: #ebddc5; stroke: #201e1d; stroke-width: 3.4; stroke-linejoin: round; }
    .wing   { fill: #201e1d; opacity: .22; }
    .body   { fill: #c67139; }
    .stripe { stroke: #201e1d; stroke-width: 3.2; stroke-linecap: round; }
    .head   { fill: #201e1d; }
    @media (prefers-color-scheme: dark) {
      .cell   { fill: #2e2b25; stroke: #f2eee6; }
      .wing   { fill: #f2eee6; }
      .body   { fill: #f08a3c; }
      .stripe { stroke: #201e1d; }
      .head   { fill: #f2eee6; }
    }
  </style>

  <path class="cell" d="M32 3 L59 18 L59 46 L32 61 L5 46 L5 18 Z"/>
  <ellipse class="wing" cx="20" cy="26" rx="8" ry="4.4" transform="rotate(-32 20 26)"/>
  <ellipse class="wing" cx="44" cy="26" rx="8" ry="4.4" transform="rotate(32 44 26)"/>
  <ellipse class="body" cx="32" cy="38" rx="9.5" ry="13"/>
  <path class="stripe" d="M23.6 33 h16.8 M24.4 42 h15.2"/>
  <circle class="head" cx="32" cy="24" r="5.4"/>
</svg>
